    var textarea=document.createElement('textarea');
    textarea.value=text;
    textarea.style.position='fixed';
    textarea.style.opacity='0';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    try{document.execCommand('copy');alert('Markdown 已复制');}
    catch(e){alert('复制失败，请手动复制');}
    document.body.removeChild(textarea);
}
function setStatsExercise(mu, exerciseName){
    statsExerciseSelection[mu]=exerciseName;
    showStats();
    setTimeout(function(){
        window.scrollTo({top:document.documentElement.scrollHeight,behavior:'auto'});
    },50);
}
function getStatsActionKey(mu,exerciseName){
    return mu+'__'+exerciseName;
}
function handleStatsExerciseClick(mu,exerciseName){
    var actionKey=getStatsActionKey(mu,exerciseName);
    if(statsActionLongPressTriggered[actionKey]){
        delete statsActionLongPressTriggered[actionKey];
        return;
    }
    if(statsActionClickTimers[actionKey])clearTimeout(statsActionClickTimers[actionKey]);
    statsActionClickTimers[actionKey]=setTimeout(function(){
        delete statsActionClickTimers[actionKey];
        setStatsExercise(mu,exerciseName);
    },220);
}
function handleStatsExerciseDoubleClick(mu,exerciseName,el){
    var actionKey=getStatsActionKey(mu,exerciseName);
    if(statsActionClickTimers[actionKey]){
        clearTimeout(statsActionClickTimers[actionKey]);
        delete statsActionClickTimers[actionKey];
    }
    cancelStatsExerciseLongPress(mu,exerciseName);
    editStatsExerciseName(mu,exerciseName,el);
}
function startStatsExerciseLongPress(mu,exerciseName,el){
    var actionKey=getStatsActionKey(mu,exerciseName);
    cancelStatsExerciseLongPress(mu,exerciseName);
    statsActionLongPressTriggered[actionKey]=false;
    statsActionLongPressTimers[actionKey]=setTimeout(function(){
        delete statsActionLongPressTimers[actionKey];
        statsActionLongPressTriggered[actionKey]=true;
        editStatsExerciseName(mu,exerciseName,el);
    },450);
}
function cancelStatsExerciseLongPress(mu,exerciseName){
    var actionKey=getStatsActionKey(mu,exerciseName);
    if(statsActionLongPressTimers[actionKey]){
        clearTimeout(statsActionLongPressTimers[actionKey]);
        delete statsActionLongPressTimers[actionKey];
    }
}
function editStatsExerciseName(mu, exerciseName, el){
    var input=document.createElement('input');
    input.type='text';
    input.className='exercise-name-input';
    input.value=exerciseName;
    input.onblur=function(){
        var newName=this.value.trim();
        if(newName&&newName!==exerciseName&&renameExerciseAcrossData(mu,exerciseName,newName)){
            save();
        }
        showStats();
        setTimeout(function(){
            var statsEl=document.getElementById('statsContainer');
            if(statsEl)statsEl.scrollIntoView({behavior:'auto',block:'start'});
        },0);
    };
    input.onkeydown=function(e){
        if(e.key==='Enter')this.blur();
        if(e.key==='Escape'){this.value=exerciseName;this.blur();}
    };
    el.innerHTML='';
    el.appendChild(input);
    input.focus();
    input.select();
}
function showStats(){
    var container=document.getElementById('statsContainer');
    var y=curDate.getFullYear(),m=curDate.getMonth();
    var muscles=['chest','back','shoulder','leg','biceps','triceps','core'];
    var isActive=function(btn){return statsSection===btn;};
    var htm='<div class="stats-buttons stats-buttons-nine">';
    for(var i=0;i<muscles.length;i++){
        var mu=muscles[i];
        var stats=calcMuscleStats(mu);
        if(stats.maxWeight>0||stats.maxDailyVol>0){
            htm+='<button class="stats-btn muscle-filter-btn '+mu+(isActive(mu)?' active':'')+'" onclick="setStats(\''+mu+'\')"><span class="stats-btn-icon">'+getMuscleIconText(mu)+'</span><span class="stats-btn-label">'+muscleNames[mu]+'</span></button>';
        }
    }
    htm+='<button class="stats-btn'+(isActive('month')?' active':'')+'" onclick="setStats(\'month\')"><span class="stats-btn-icon">📅</span><span class="stats-btn-label">月总</span></button>';
    htm+='<button class="stats-btn'+(isActive('year')?' active':'')+'" onclick="setStats(\'year\')"><span class="stats-btn-icon">📆</span><span class="stats-btn-label">年总</span></button>';
    htm+='<button class="stats-btn'+(isActive('days')?' active':'')+'" onclick="setStats(\'days\')"><span class="stats-btn-icon">🎯</span><span class="stats-btn-label">部位</span></button>';
    htm+='<button class="stats-btn'+(isActive('summary')?' active':'')+'" onclick="setStats(\'summary\')"><span class="stats-btn-icon">📝</span><span class="stats-btn-label">总结</span></button>';
    htm+='</div>';
    // 计算本月各部位训练天数
    var monthlyDays={};
    var monthlyMuscleDays={chest:0,back:0,shoulder:0,leg:0,biceps:0,triceps:0,core:0};
    for(var dk in data){
        var parts=dk.split('-');
        var y2=parseInt(parts[0]),m2=parseInt(parts[1])-1;
        if(y2===y&&m2===m){
            monthlyDays[dk]=true;
            var exs=data[dk];
            var seen={};
            for(var i=0;i<exs.length;i++){
                var mu=exs[i].muscle;
                if(!seen[mu]&&monthlyMuscleDays.hasOwnProperty(mu)){seen[mu]=true;monthlyMuscleDays[mu]++;}
            }
        }
    }
    var dataDateKeys=Object.keys(data).sort();
    var today=new Date();
    today.setHours(0,0,0,0);
    var firstWorkoutKey='';
    var firstWorkoutDate=null;
    for(var dki=0;dki<dataDateKeys.length;dki++){
        var keyParts=dataDateKeys[dki].split('-');
        var keyDate=new Date(parseInt(keyParts[0]),parseInt(keyParts[1])-1,parseInt(keyParts[2]));
        keyDate.setHours(0,0,0,0);
        if(keyDate<=today){
            firstWorkoutKey=dataDateKeys[dki];
            firstWorkoutDate=keyDate;
            break;
        }
    }
    var yearlyWorkoutDays=0;
    for(var dk in data){
        var parts=dk.split('-');
        var workoutDate=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
        workoutDate.setHours(0,0,0,0);
        if(firstWorkoutDate&&workoutDate>=firstWorkoutDate&&workoutDate<=today){
            yearlyWorkoutDays++;
        }
    }
    var monthWorkoutDays=Object.keys(monthlyDays).length;
    var totalMonthDays=getMonthDays(y,m);
    var monthRestDays=totalMonthDays-monthWorkoutDays;
    var totalYearDays=firstWorkoutDate?Math.max(1,Math.round((today-firstWorkoutDate)/86400000)+1):0;
    var yearlyRestDays=totalYearDays-yearlyWorkoutDays;
    if(statsSection==='month'){
        htm+='<div class="stats-card">';
        htm+='<div class="stats-card-title">📅 '+y+'年'+(m+1)+'月 总览</div>';
        htm+='<div class="stats-card-item"><div class="stats-label">🏋️ 锻炼天数</div><div class="stats-value"><span class="highlight">'+monthWorkoutDays+'</span> 天</div></div>';
        htm+='<div class="stats-card-item"><div class="stats-label">😴 休息天数</div><div class="stats-value"><span class="highlight">'+monthRestDays+'</span> 天</div></div>';
        htm+='<div class="stats-card-item"><div class="stats-label">📊 月出勤率</div><div class="stats-value">'+Math.round(monthWorkoutDays/totalMonthDays*100)+'%</div></div>';
        htm+='</div>';
    }
    if(statsSection==='year'){
        htm+='<div class="stats-card">';
        htm+='<div class="stats-card-title">📆 累计总览</div>';
        if(firstWorkoutKey){
            htm+='<div class="stats-card-item"><div class="stats-label">🗓️ 统计区间</div><div class="stats-value">'+firstWorkoutKey+' 至 '+getTodayKey()+'</div></div>';
        }
        htm+='<div class="stats-card-item"><div class="stats-label">🏋️ 锻炼天数</div><div class="stats-value"><span class="highlight">'+yearlyWorkoutDays+'</span> 天</div></div>';
        htm+='<div class="stats-card-item"><div class="stats-label">😴 休息天数</div><div class="stats-value"><span class="highlight">'+yearlyRestDays+'</span> 天</div></div>';
        htm+='<div class="stats-card-item"><div class="stats-label">📊 累计出勤率</div><div class="stats-value">'+(totalYearDays?Math.round(yearlyWorkoutDays/totalYearDays*100):0)+'%</div></div>';
        htm+='</div>';
    }
    if(statsSection==='days'){
        htm+='<div class="stats-card">';
        htm+='<div class="stats-card-title">🎯 本月各部位训练天数</div>';
        var hasAnyMuscle=false;
        for(var i=0;i<muscles.length;i++){
            var mu=muscles[i];
            var days=monthlyMuscleDays[mu];
            var hasData=false;
            for(var dk in data){
                var parts=dk.split('-');
                if(parseInt(parts[0])===y&&parseInt(parts[1])-1===m){
                    var exs=data[dk];
                    for(var j=0;j<exs.length;j++){
                        if(exs[j].muscle===mu){hasData=true;break;}
                    }
                    if(hasData)break;
                }
            }
            if(hasData){
                hasAnyMuscle=true;
                htm+='<div class="stats-card-item"><div class="stats-label"><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:'+muscleColors[mu]+';margin-right:6px;vertical-align:middle;"></span>'+getMuscleIconText(mu)+' '+muscleNames[mu]+'</div><div class="stats-value"><span class="highlight">'+days+'</span> 天</div></div>';
            }
        }
        if(!hasAnyMuscle)htm+='<div class="stats-empty">本月暂无部位数据</div>';
        htm+='</div>';
    }
    if(statsSection==='summary'){
        htm+='<div class="stats-card">';
        htm+='<div class="stats-card-title">📝 全量训练总结</div>';
        htm+='<div class="stats-summary-actions"><button class="stats-copy-btn" onclick="copySummaryMarkdown()">复制 Markdown</button></div>';
        htm+='<pre class="stats-markdown">'+escapeHtml(generateSummaryMarkdown())+'</pre>';
        htm+='</div>';
    }else if(statsSection&&muscleNames[statsSection]){
        var mu=statsSection;
        var s=calcMuscleStats(mu);
        htm+='<div class="stats-card">';
        if(s.milestones&&s.milestones.length){
            htm+='<div class="milestone-section">';
            var milestoneNames=Object.keys(s.exerciseMilestones||{}).filter(function(name){
                return s.exerciseMilestones[name]&&s.exerciseMilestones[name].length;
            });
            if(milestoneNames.length){
                var activeExercise=statsExerciseSelection[mu];
                if(!activeExercise||milestoneNames.indexOf(activeExercise)<0){
                    activeExercise=milestoneNames[0];
                    statsExerciseSelection[mu]=activeExercise;
                }
                htm+='<div class="milestone-actions">';
                for(var mni=0;mni<milestoneNames.length;mni++){
                    var exerciseName=milestoneNames[mni];
                    var escapedExerciseName=escapeJsSingleQuotedString(exerciseName);
                    htm+='<button class="milestone-action-btn'+(exerciseName===activeExercise?' active':'')+'" onclick="handleStatsExerciseClick(\''+mu+'\',\''+escapedExerciseName+'\')" ondblclick="handleStatsExerciseDoubleClick(\''+mu+'\',\''+escapedExerciseName+'\',this)" onmousedown="startStatsExerciseLongPress(\''+mu+'\',\''+escapedExerciseName+'\',this)" onmouseup="cancelStatsExerciseLongPress(\''+mu+'\',\''+escapedExerciseName+'\')" onmouseleave="cancelStatsExerciseLongPress(\''+mu+'\',\''+escapedExerciseName+'\')" ontouchstart="startStatsExerciseLongPress(\''+mu+'\',\''+escapedExerciseName+'\',this)" ontouchend="cancelStatsExerciseLongPress(\''+mu+'\',\''+escapedExerciseName+'\')" ontouchcancel="cancelStatsExerciseLongPress(\''+mu+'\',\''+escapedExerciseName+'\')" ontouchmove="cancelStatsExerciseLongPress(\''+mu+'\',\''+escapedExerciseName+'\')" title="双击或长按修改动作名称">'+escapeHtml(exerciseName)+'</button>';
                }
                htm+='</div>';
                var milestoneList=s.exerciseMilestones[activeExercise].slice(-3).reverse();
                for(var mi=0;mi<milestoneList.length;mi++){
                    var milestone=milestoneList[mi];
                    htm+='<div class="milestone-item">'+
                        '<div class="milestone-value">'+milestone.weight+' kg</div>'+
                        '<div class="milestone-meta">'+milestone.sets+'组 × '+milestone.reps+'次</div>'+
                        '<div class="milestone-date">'+milestone.date+'</div>'+
                    '</div>';
                }
            }
            htm+='</div>';
        }else{
            htm+='<div class="stats-empty">暂无 milestone 数据</div>';
        }
        htm+='</div>';
    }
    container.innerHTML=htm;
}
function setStats(btn){
    statsSection=(statsSection===btn)?null:btn;
    showStats();
    // 点击后自动滚动到页面底部查看卡片内容
    setTimeout(function(){
        var el=document.getElementById('statsContainer');
        if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    },50);
}
function exportData(){
    var exportPayload=Object.keys(dayTimeOverrides||{}).length?{data:data,dayTimeOverrides:dayTimeOverrides}:data;
    var jsonStr=JSON.stringify(exportPayload,null,2);
    var blob=new Blob([jsonStr],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='fitness-data-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
    URL.revokeObjectURL(url);
}
function importData(input){
    var file=input.files[0];
    if(!file)return;
    var reader=new FileReader();
    reader.onload=function(e){
        try{
            var imported=JSON.parse(e.target.result);
            if(confirm('确定要导入数据吗？这将覆盖当前所有数据。')){
                if(imported&&typeof imported==='object'&&!Array.isArray(imported)&&imported.data&&typeof imported.data==='object'){
                    data=imported.data;
                    dayTimeOverrides=imported.dayTimeOverrides&&typeof imported.dayTimeOverrides==='object'?imported.dayTimeOverrides:{};
                }else{
                    data=imported;
                    dayTimeOverrides={};
                }
                save();
                saveDayTimeOverrides();
                render();
                if(selDate)showDetail(selDate);
                alert('导入成功！');
            }
        }catch(err){
            alert('导入失败：文件格式不正确');
        }
    };
    reader.readAsText(file);
    input.value='';
}
function init(){
    render();
    var dk = getTodayKey();
    selDate = dk;
    render();
    showDetail(dk);
    switchPage(currentPage);
}
init();
    </script>
