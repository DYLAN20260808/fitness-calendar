<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0071e3">
    <title>健身月历</title>
    <style>
        :root {
            --accent: #0071e3;
            --accent-soft: rgba(0, 113, 227, 0.12);
            --accent-soft-strong: rgba(0, 113, 227, 0.2);
            --accent-bright: #59b7ff;
            --accent-mid: #2997ff;
            --accent-deep: #0058b0;
            --bg: #f5f5f7;
            --bg-2: #eef1f5;
            --bg-3: #e6ebf2;
            --card: rgba(255, 255, 255, 0.76);
            --card-strong: rgba(255, 255, 255, 0.92);
            --surface-top: rgba(255,255,255,0.96);
            --surface-mid: rgba(245,247,250,0.88);
            --surface-bot: rgba(229,234,241,0.78);
            --text: #1d1d1f;
            --muted: #6e6e73;
            --line: rgba(29, 29, 31, 0.08);
            --glass-line: rgba(255, 255, 255, 0.72);
            --glass-shadow: inset 0 1px 0 rgba(255,255,255,0.88), inset 0 -1px 0 rgba(255,255,255,0.22);
            --shadow: 0 16px 40px rgba(17, 24, 39, 0.08);
            --shadow-deep: 0 24px 56px rgba(17, 24, 39, 0.14);
            --shadow-lift: 0 14px 28px rgba(17, 24, 39, 0.1), 0 3px 10px rgba(17, 24, 39, 0.05);
            --highlight: inset 0 1px 0 rgba(255,255,255,0.96), inset 0 -10px 18px rgba(255,255,255,0.1);
            --primary-gradient: linear-gradient(180deg, var(--accent-bright) 0%, var(--accent-mid) 52%, var(--accent-deep) 100%);
            --neutral-gradient: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(241,244,248,0.92) 100%);
            --danger-top: #ff8f86;
            --danger-mid: #ff5f57;
            --danger-bottom: #d9342b;
            --today-bright: #7ce7a0;
            --today-mid: #34c759;
            --today-deep: #1f9d47;
            --today-ring: rgba(48, 209, 88, 0.88);
            --today-glow: rgba(48, 209, 88, 0.24);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        button { position: relative; transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease, opacity 0.16s ease, background 0.16s ease, color 0.16s ease; }
        button::after { content: ''; position: absolute; inset: -4px; border-radius: inherit; border: 2px solid rgba(89,183,255,0); box-shadow: 0 0 0 0 rgba(41,151,255,0); opacity: 0; pointer-events: none; }
        button:not(:disabled):active { filter: brightness(0.98) saturate(1.06); }
        button.tap-feedback::after { animation: buttonTapRing 0.42s ease-out; }
        button.tap-feedback { animation: buttonTapFlash 0.42s ease-out; }
        @keyframes buttonTapRing {
            0% { opacity: 0.95; border-color: rgba(89,183,255,0.72); box-shadow: 0 0 0 0 rgba(41,151,255,0.24); }
            100% { opacity: 0; border-color: rgba(89,183,255,0); box-shadow: 0 0 0 12px rgba(41,151,255,0); }
        }
        @keyframes buttonTapFlash {
            0% { filter: brightness(1.12) saturate(1.08); }
            100% { filter: brightness(1) saturate(1); }
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: radial-gradient(circle at top left, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 30%), radial-gradient(circle at top right, rgba(90,181,255,0.14) 0%, rgba(90,181,255,0) 32%), radial-gradient(circle at center top, rgba(255,255,255,0.76) 0%, rgba(255,255,255,0) 44%), linear-gradient(180deg, #fbfbfd 0%, var(--bg) 22%, var(--bg-2) 58%, var(--bg-3) 100%); min-height: 100vh; color: var(--text); padding-bottom: 192px; position: relative; overflow-x: hidden; }
        body::before { content: ''; position: fixed; inset: -12% -10% auto; height: 38vh; background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.35) 28%, rgba(255,255,255,0) 72%); pointer-events: none; z-index: 0; }
        body::after { content: ''; position: fixed; right: -70px; bottom: 10vh; width: 220px; height: 220px; background: radial-gradient(circle, rgba(41,151,255,0.14) 0%, rgba(41,151,255,0.03) 44%, rgba(41,151,255,0) 76%); filter: blur(12px); pointer-events: none; z-index: 0; }
        .header { background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(250,250,252,0.78) 100%); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border-bottom: 1px solid var(--glass-line); padding: 10px 0; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--highlight), 0 12px 30px rgba(17,24,39,0.1), 0 2px 0 rgba(255,255,255,0.92); }
        .header h1 { font-size: 18px; font-weight: 600; color: var(--text); }
        .header-action { position: absolute; top: 50%; transform: translateY(-50%); background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(243,246,250,0.9) 100%); border: 1px solid rgba(255,255,255,0.82); color: var(--accent); padding: 3px 8px; border-radius: 8px; cursor: pointer; font-size: 9px; font-weight: 700; box-shadow: inset 0 1px 0 rgba(255,255,255,0.94), 0 8px 14px rgba(17,24,39,0.06); }
        .header-action.left { left: 15px; }
        .header-action.right { right: 15px; }
        .header-action:active { transform: translateY(calc(-50% + 1px)); }
        #importFile { display: none; }
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; margin: 10px 5px 4px; border-radius: 10px; background: linear-gradient(180deg, rgba(255,255,255,0.78) 0%, rgba(242,244,248,0.62) 100%); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.72); box-shadow: var(--highlight), var(--shadow-lift); position: relative; z-index: 1; }
        .nav button { background: var(--primary-gradient); border: 1px solid rgba(255,255,255,0.42); color: white; padding: 5px 12px; border-radius: 10px; font-size: 12px; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.38), inset 0 -2px 0 rgba(0,88,176,0.24), 0 8px 14px rgba(0,113,227,0.2); transition: transform 0.2s, box-shadow 0.2s; }
        .nav button:active { transform: translateY(2px) scale(0.97); box-shadow: inset 0 1px 0 rgba(255,255,255,0.32), 0 4px 10px rgba(0,113,227,0.16); }
        .nav .month-year { font-size: 15px; font-weight: 600; color: var(--text); }
        .page-section { position: relative; z-index: 1; }
        .page-section.hidden { display: none; }
        .calendar-add-wrap { padding: 12px 5px 0; }
        .calendar-add-btn { width: 100%; }
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 3px; position: relative; z-index: 1; }
        .weekday { text-align: center; padding: 6px 3px; font-weight: 600; color: var(--accent); font-size: 11px; }
        .day { aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; background: linear-gradient(180deg, var(--surface-top) 0%, var(--surface-mid) 42%, var(--surface-bot) 100%); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.82); border-radius: 11px; padding: 1px; cursor: pointer; min-height: 16px; box-shadow: var(--highlight), 0 10px 18px rgba(17,24,39,0.08), 0 2px 0 rgba(255,255,255,0.9); overflow: hidden; transform: translateY(0); transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease; }
        .day:hover { background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(248,250,253,0.92) 44%, rgba(232,238,246,0.82) 100%); box-shadow: var(--highlight), 0 16px 26px rgba(17,24,39,0.12), 0 2px 0 rgba(255,255,255,0.9); transform: translateY(-3px); }
        .day.empty { background: transparent; cursor: default; box-shadow: none; }
        .day.today { border-color: rgba(255,255,255,0.82); background: linear-gradient(135deg, rgba(245,255,249,1) 0%, rgba(214,247,224,0.98) 42%, rgba(52,199,89,0.34) 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.92), inset 0 -10px 18px rgba(31,157,71,0.12), 0 0 0 2px var(--today-ring), 0 14px 24px var(--today-glow); }
        .day.selected { background: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(236,245,255,0.98) 42%, rgba(0,113,227,0.2) 100%); border-color: rgba(255,255,255,0.82); box-shadow: inset 0 1px 0 rgba(255,255,255,0.94), inset 0 -10px 18px rgba(0,113,227,0.06), 0 0 0 2px rgba(0,113,227,0.82), 0 18px 28px rgba(0,113,227,0.16); transform: translateY(-2px); }
        .day.today.selected { background: linear-gradient(135deg, rgba(245,255,249,1) 0%, rgba(196,243,210,0.98) 42%, rgba(52,199,89,0.48) 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.94), inset 0 -10px 18px rgba(31,157,71,0.14), 0 0 0 2px rgba(52,199,89,0.92), 0 18px 28px rgba(52,199,89,0.22); transform: translateY(-2px); }
        .day-number { font-size: 8px; font-weight: 700; margin-bottom: 1px; line-height: 1; flex-shrink: 0; width: 100%; text-align: center; }
        .day-icons { display: flex; flex: 1; flex-wrap: wrap; gap: 1px; justify-content: center; align-items: center; align-content: center; width: 100%; max-height: none; overflow: hidden; }
        .day-icons.count-3,
        .day-icons.count-4,
        .day-icons.count-5,
        .day-icons.count-6,
        .day-icons.count-7 { gap: 1px; padding-top: 1px; }
        .day-volume { font-size: 8px; color: var(--accent); margin-top: 1px; font-weight: 700; line-height: 1; flex-shrink: 0; }
        .muscle-icon { width: 13px; height: 13px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px; margin: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,0.24), 0 3px 6px rgba(15,23,42,0.12); }
        .day-icons.count-3 .muscle-icon,
        .day-icons.count-4 .muscle-icon,
        .day-icons.count-5 .muscle-icon,
        .day-icons.count-6 .muscle-icon,
        .day-icons.count-7 .muscle-icon { width: 10px; height: 10px; font-size: 7px; margin: 0; border-radius: 2px; }
        .chest { background: linear-gradient(180deg, #ffb27d 0%, #ff8a4c 100%); }
        .back { background: linear-gradient(180deg, #8da2ff 0%, #5b6cff 100%); }
        .shoulder { background: linear-gradient(180deg, #b287ff 0%, #8a63ff 100%); }
        .leg { background: linear-gradient(180deg, #66d4c1 0%, #2fb59f 100%); }
        .biceps { background: linear-gradient(180deg, #7fd3ff 0%, #3aa0ff 100%); }
        .triceps { background: linear-gradient(180deg, #90b7ff 0%, #4d7dff 100%); }
        .core { background: linear-gradient(180deg, #ffd86f 0%, #ffb340 100%); }
        .cardio { background: linear-gradient(180deg, #ff8f86 0%, #ff5f57 100%); }
        .form-group select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,0.88); color: var(--text); font-size: 16px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.28); z-index: 200; align-items: center; justify-content: center; padding: 5px; }
        .modal.show { display: flex; }
        .modal-content { background: linear-gradient(180deg, rgba(255,255,255,0.97) 0%, rgba(247,248,251,0.9) 40%, rgba(232,236,242,0.82) 100%); -webkit-backdrop-filter: blur(28px) saturate(185%); backdrop-filter: blur(28px) saturate(185%); border: 1px solid rgba(255,255,255,0.8); border-radius: 20px; padding: 12px; width: 100%; max-width: 280px; max-height: 90vh; overflow-y: auto; box-shadow: var(--highlight), var(--shadow-deep), 0 2px 0 rgba(255,255,255,0.9); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .modal-header h2 { font-size: 14px; color: var(--text); }
        .close-btn { background: none; border: none; color: var(--accent); font-size: 16px; cursor: pointer; }
        .close-btn:active { transform: scale(0.9) rotate(-8deg); }
        .muscle-select { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 10px; }
        .muscle-btn { padding: 8px 6px; border: 1px solid rgba(255,255,255,0.32); border-radius: 10px; color: white; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.26), inset 0 -4px 10px rgba(0,0,0,0.08), 0 8px 16px rgba(15,23,42,0.12); transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease; }
        .muscle-btn:active { transform: translateY(2px) scale(0.97); }
        .muscle-btn.selected { opacity: 0.92; box-shadow: 0 0 0 2px var(--accent), inset 0 1px 0 rgba(255,255,255,0.3), 0 12px 20px rgba(0,113,227,0.18); transform: translateY(-1px); }
        .muscle-btn span { font-size: 16px; }
        .muscle-btn.core span,
        .record-muscle-btn.core .record-muscle-icon,
        .stats-btn.muscle-filter-btn.core .stats-btn-icon { color: #c99720; text-shadow: 0 1px 0 rgba(255,255,255,0.28), 0 1px 4px rgba(124,86,14,0.24); font-weight: 800; }
        .detail-section { background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(247,248,251,0.8) 44%, rgba(232,236,242,0.72) 100%); -webkit-backdrop-filter: blur(24px) saturate(175%); backdrop-filter: blur(24px) saturate(175%); border: 1px solid rgba(255,255,255,0.74); border-radius: 22px; margin: 12px 5px; padding: 15px; box-shadow: var(--highlight), var(--shadow-deep), 0 2px 0 rgba(255,255,255,0.9); position: relative; z-index: 1; }
        .detail-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 18px; font-weight: 600; margin-bottom: 15px; color: var(--accent); cursor: pointer; }
        .detail-header-text { min-width: 0; }
        .detail-header-badge { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; min-height: 28px; padding: 0 10px; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(237,244,252,0.92) 100%); border: 1px solid rgba(0,113,227,0.12); color: var(--accent-deep); font-size: 11px; font-weight: 700; line-height: 1; white-space: nowrap; box-shadow: inset 0 1px 0 rgba(255,255,255,0.94), 0 5px 10px rgba(0,113,227,0.08); }
        .detail-header.is-today { color: var(--today-deep); }
        .detail-header.is-today .detail-header-text { color: var(--today-deep); }
        .detail-header.is-today .detail-header-badge { background: linear-gradient(180deg, rgba(245,255,249,0.98) 0%, rgba(220,248,228,0.94) 100%); border-color: rgba(52,199,89,0.2); color: var(--today-deep); box-shadow: inset 0 1px 0 rgba(255,255,255,0.94), 0 5px 10px rgba(52,199,89,0.12); }
        .exercise-list { display: flex; flex-direction: column; gap: 10px; }
        .record-muscle-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .record-muscle-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 32px; min-height: 56px; border: 1px solid rgba(0,113,227,0.12); border-radius: 16px; background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(237,244,252,0.92) 100%); color: var(--accent-deep); padding: 8px 0; font-size: 11px; font-weight: 700; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.94), 0 5px 10px rgba(0,113,227,0.06); white-space: normal; overflow: hidden; text-overflow: clip; text-align: center; line-height: 1.1; flex: 0 0 auto; }
        .record-muscle-btn.active { border-width: 2px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.56), 0 6px 12px rgba(17,24,39,0.08); }
        .record-muscle-btn:active { transform: translateY(2px) scale(0.97); box-shadow: inset 0 1px 0 rgba(255,255,255,0.88), 0 3px 8px rgba(0,113,227,0.08); }

        .exercise-row2 { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; font-size: 12px; }

    <script>
var data = JSON.parse(localStorage.getItem('fd')||'{}');
var customExerciseNames = JSON.parse(localStorage.getItem('fd_custom_exercise_names')||'{}');
var dayTimeOverrides = JSON.parse(localStorage.getItem('fd_day_time_overrides')||'{}');
var curDate = new Date(), selDate = null, selMuscle = null, editIdx = -1;
var volumeMuscle = null;
var volumeExerciseSelection = {};
var volumeMetricMode = 'interval';
var currentPage = 'calendar';
var exerciseDropdownOpen = false;
var recordActionClickTimers = {};
var recordActionLongPressTimers = {};
var recordActionLongPressTriggered = {};
var recordValueFlashState = {};
var statsActionClickTimers = {};
var statsActionLongPressTimers = {};
var statsActionLongPressTriggered = {};
var recordActionTabs = {};
var recordMuscleTabs = {};
var recordGroupTimerStarts = {};
var recordGroupTimerIntervalId = null;
var icons = {chest:'❤️',back:'🛡️',shoulder:'🏋️',leg:'🦵',biceps:'💪',triceps:'🔱',core:'♎',cardio:'🏃'};
var exerciseNames = {
    chest:['卧推','上斜卧推','下斜卧推','哑铃飞鸟','器械夹胸','俯卧撑'],
    back:['引体向上','高位下拉','杠铃划船','哑铃划船','坐姿划船','硬拉'],
    shoulder:['哑铃推举','杠铃推举','侧平举','前平举','俯身飞鸟','面拉'],
    leg:['深蹲','腿举','腿弯举','腿屈伸','弓步蹲','小腿提踵'],
    biceps:['哑铃弯举','杠铃弯举','锤式弯举','集中弯举'],
    triceps:['绳索下压','哑铃臂屈伸','仰卧臂屈伸','过顶臂屈伸'],
    core:['卷腹','仰卧起坐','平板支撑','俄罗斯转体','悬垂举腿','健腹轮'],
    cardio:['跑步','椭圆机','动感单车','跳绳','游泳','爬楼梯','划船机']
};
function save(){localStorage.setItem('fd',JSON.stringify(data));}
function saveCustomExerciseNames(){localStorage.setItem('fd_custom_exercise_names',JSON.stringify(customExerciseNames));}
function saveDayTimeOverrides(){localStorage.setItem('fd_day_time_overrides',JSON.stringify(dayTimeOverrides));}
function getRecordGroupTimerKey(dk,muscle){
    return String(dk||'')+'::'+String(muscle||'');
}
function formatRecordGroupTimer(elapsedMs){
    var totalSeconds=Math.max(0,Math.floor((elapsedMs||0)/1000));
    var minutes=Math.floor(totalSeconds/60);
    var seconds=totalSeconds%60;
    return pad(minutes)+':'+pad(seconds);
}
function getRecordGroupTimerLabel(dk,muscle){
    var startedAt=recordGroupTimerStarts[getRecordGroupTimerKey(dk,muscle)];
    if(!startedAt)return '00:00';
    return formatRecordGroupTimer(Date.now()-startedAt);
}
function renderRecordGroupTimerButtons(){
    document.querySelectorAll('.exercise-timer-btn').forEach(function(button){
        var valueEl=button.querySelector('.exercise-timer-value');
        var nextLabel=getRecordGroupTimerLabel(button.dataset.dateKey,button.dataset.muscle);
        if(valueEl)valueEl.textContent=nextLabel;
        else button.textContent=nextLabel;
    });
}
function ensureRecordGroupTimerInterval(){
    if(recordGroupTimerIntervalId!==null)return;
    recordGroupTimerIntervalId=window.setInterval(renderRecordGroupTimerButtons,1000);
}
function startRecordGroupTimer(dk,muscle){
    if(!dk||!muscle)return;
    recordGroupTimerStarts[getRecordGroupTimerKey(dk,muscle)]=Date.now();
    ensureRecordGroupTimerInterval();
    renderRecordGroupTimerButtons();
}
function resetRecordGroupTimer(dk,muscle){
    startRecordGroupTimer(dk,muscle);
}
function normalizeArmMuscleByName(name){
    var trimmed=(name||'').trim();
    if(/下压|臂屈伸|过顶|仰卧臂屈伸|窄距卧推/.test(trimmed))return 'triceps';
    if(/弯举|锤式|集中/.test(trimmed))return 'biceps';
    return 'biceps';
}
function migrateLegacyArmData(){
    var changed=false;
    for(var dk in data){
        var exercises=data[dk]||[];
        for(var i=0;i<exercises.length;i++){
            if(exercises[i].muscle==='arm'){
                exercises[i].muscle=normalizeArmMuscleByName(exercises[i].name);
                changed=true;
            }
        }
    }
    if(Array.isArray(customExerciseNames.arm)){
        for(var ni=0;ni<customExerciseNames.arm.length;ni++){
            var legacyName=customExerciseNames.arm[ni];
            var nextMuscle=normalizeArmMuscleByName(legacyName);
            if(!Array.isArray(customExerciseNames[nextMuscle]))customExerciseNames[nextMuscle]=[];
            if(customExerciseNames[nextMuscle].indexOf(legacyName)<0)customExerciseNames[nextMuscle].push(legacyName);
        }
        delete customExerciseNames.arm;
        saveCustomExerciseNames();
    }
    if(changed)save();
}
function migrateLegacyDayTimeOverrides(){
    var changed=false;
    for(var dk in dayTimeOverrides){
        var dateOverrides=dayTimeOverrides[dk];
        if(!dateOverrides||typeof dateOverrides!=='object')continue;
        if(dateOverrides.firstAddedAt!=null){
            var migratedFirstAddedAt=projectTimestampToDateKey(dk,dateOverrides.firstAddedAt);
            if(migratedFirstAddedAt!==dateOverrides.firstAddedAt){
                dateOverrides.firstAddedAt=migratedFirstAddedAt;
                changed=true;
            }
        }
        if(dateOverrides.lastUpdatedAt!=null){
            var migratedLastUpdatedAt=projectTimestampToDateKey(dk,dateOverrides.lastUpdatedAt);
            if(migratedLastUpdatedAt!==dateOverrides.lastUpdatedAt){
                dateOverrides.lastUpdatedAt=migratedLastUpdatedAt;
                changed=true;
            }
        }
        var migratedDateHistory=normalizeRefreshHistoryArray(dk,dateOverrides.refreshHistory);
        if(Array.isArray(dateOverrides.refreshHistory)||migratedDateHistory.length){
            if(migratedDateHistory.length){
                if(!Array.isArray(dateOverrides.refreshHistory)||migratedDateHistory.length!==dateOverrides.refreshHistory.length||migratedDateHistory.some(function(item,idx){return item!==dateOverrides.refreshHistory[idx];})){
                    dateOverrides.refreshHistory=migratedDateHistory;
                    changed=true;
                }
            }else if(dateOverrides.refreshHistory!==undefined){
                delete dateOverrides.refreshHistory;
                changed=true;
            }
        }
        for(var muscleKey in dateOverrides){
            if(muscleKey==='firstAddedAt'||muscleKey==='lastUpdatedAt'||muscleKey==='refreshHistory')continue;
            var muscleOverrides=dateOverrides[muscleKey];
            if(!muscleOverrides||typeof muscleOverrides!=='object')continue;
            if(muscleOverrides.firstAddedAt!=null){
                var migratedMuscleFirstAddedAt=projectTimestampToDateKey(dk,muscleOverrides.firstAddedAt);
                if(migratedMuscleFirstAddedAt!==muscleOverrides.firstAddedAt){
                    muscleOverrides.firstAddedAt=migratedMuscleFirstAddedAt;
                    changed=true;
                }
            }
            if(muscleOverrides.lastUpdatedAt!=null){
                var migratedMuscleLastUpdatedAt=projectTimestampToDateKey(dk,muscleOverrides.lastUpdatedAt);
                if(migratedMuscleLastUpdatedAt!==muscleOverrides.lastUpdatedAt){
                    muscleOverrides.lastUpdatedAt=migratedMuscleLastUpdatedAt;
                    changed=true;
                }
            }
            var migratedMuscleHistory=normalizeRefreshHistoryArray(dk,muscleOverrides.refreshHistory);
            if(Array.isArray(muscleOverrides.refreshHistory)||migratedMuscleHistory.length){
                if(migratedMuscleHistory.length){
                    if(!Array.isArray(muscleOverrides.refreshHistory)||migratedMuscleHistory.length!==muscleOverrides.refreshHistory.length||migratedMuscleHistory.some(function(item,idx){return item!==muscleOverrides.refreshHistory[idx];})){
                        muscleOverrides.refreshHistory=migratedMuscleHistory;
                        changed=true;
                    }
                }else if(muscleOverrides.refreshHistory!==undefined){
                    delete muscleOverrides.refreshHistory;
                    changed=true;
                }
            }
        }
    }
    if(changed)saveDayTimeOverrides();
}
migrateLegacyArmData();
migrateLegacyDayTimeOverrides();
function getCustomExerciseNames(m){
    var names=customExerciseNames[m];
    return Array.isArray(names)?names:[];
}
function hydrateCustomExerciseNamesFromData(){
    var changed=false;
    for(var dk in data){
        var exercises=data[dk]||[];
        for(var i=0;i<exercises.length;i++){
            var exercise=exercises[i];
            var muscle=exercise.muscle;
            var name=(exercise.name||'').trim();
            if(!muscle||!name)continue;
            if((exerciseNames[muscle]||[]).indexOf(name)>=0)continue;
            var names=getCustomExerciseNames(muscle).slice();
            if(names.indexOf(name)>=0)continue;
            names.push(name);
            customExerciseNames[muscle]=names;
            changed=true;
        }
    }
    if(changed)saveCustomExerciseNames();
}
function rememberCustomExerciseName(m,name){
    var trimmed=(name||'').trim();
    if(!m||!trimmed)return;
    if((exerciseNames[m]||[]).indexOf(trimmed)>=0)return;
    var names=getCustomExerciseNames(m).slice();
    if(names.indexOf(trimmed)>=0)return;
    names.push(trimmed);
    customExerciseNames[m]=names;
    saveCustomExerciseNames();
}
hydrateCustomExerciseNamesFromData();
function pad(n){return String(n).padStart(2,'0');}
function getNowTimestamp(){
    return Date.now();
}
function normalizeTimestampValue(value){
    if(value==null||value==='')return null;
    var timestamp=Number(value);
    if(isNaN(timestamp)||timestamp<=0)return null;
    return timestamp;
}
function formatClockTime(timestamp){
    var normalized=normalizeTimestampValue(timestamp);
    if(!normalized)return '--:--:--';
    var date=new Date(normalized);
    return pad(date.getHours())+':'+pad(date.getMinutes())+':'+pad(date.getSeconds());
}
function formatClockTimeInput(timestamp){
    var normalized=normalizeTimestampValue(timestamp);
    if(!normalized)return '';
    var date=new Date(normalized);
    return pad(date.getHours())+':'+pad(date.getMinutes())+':'+pad(date.getSeconds());
}
function getClockParts(timestamp){
    var normalized=normalizeTimestampValue(timestamp);
    if(!normalized)return {hours:'00',minutes:'00',seconds:'00'};
    var date=new Date(normalized);
    return {hours:pad(date.getHours()),minutes:pad(date.getMinutes()),seconds:pad(date.getSeconds())};
}
function getClockSeconds(timestamp){
    var normalized=normalizeTimestampValue(timestamp);
    if(!normalized)return null;
    var date=new Date(normalized);
    return date.getHours()*3600+date.getMinutes()*60+date.getSeconds();
}
function getDayTimestampFromClockInput(dk,value){
    var match=/^(\d{2}):(\d{2})(?::(\d{2}))?$/.exec(String(value||''));
    if(!match)return null;
    var dateParts=String(dk||'').split('-');
    if(dateParts.length!==3)return null;
    var year=Number(dateParts[0]);
    var month=Number(dateParts[1])-1;
    var day=Number(dateParts[2]);
    var hours=Number(match[1]);
    var minutes=Number(match[2]);
    var seconds=Number(match[3]||0);
    if(isNaN(year)||isNaN(month)||isNaN(day)||isNaN(hours)||isNaN(minutes)||isNaN(seconds))return null;
    return new Date(year,month,day,hours,minutes,seconds,0).getTime();
}
function projectTimestampToDateKey(dk,timestamp){
    var normalized=normalizeTimestampValue(timestamp);
    if(!normalized)return null;
    var dateParts=String(dk||'').split('-');
    if(dateParts.length!==3)return normalized;
    var sourceDate=new Date(normalized);
    var year=Number(dateParts[0]);
    var month=Number(dateParts[1])-1;
    var day=Number(dateParts[2]);
    if(isNaN(year)||isNaN(month)||isNaN(day))return normalized;
    return new Date(year,month,day,sourceDate.getHours(),sourceDate.getMinutes(),sourceDate.getSeconds(),0).getTime();
}
function getNowTimestampForDateKey(dk){
    return projectTimestampToDateKey(dk,getNowTimestamp());
}
function clampEndTimestampToSameDayRange(startTimestamp,endTimestamp){
    var normalizedStart=normalizeTimestampValue(startTimestamp);
    var normalizedEnd=normalizeTimestampValue(endTimestamp);
    if(normalizedStart===null||normalizedEnd===null)return normalizedEnd;
    var startSeconds=getClockSeconds(normalizedStart);
    var endSeconds=getClockSeconds(normalizedEnd);
    if(startSeconds===null||endSeconds===null)return normalizedEnd;
    return startSeconds>endSeconds?normalizedStart:normalizedEnd;
}
function clampStartTimestampToSameDayRange(startTimestamp,endTimestamp){
    var normalizedStart=normalizeTimestampValue(startTimestamp);
    var normalizedEnd=normalizeTimestampValue(endTimestamp);
    if(normalizedStart===null||normalizedEnd===null)return normalizedStart;
    var startSeconds=getClockSeconds(normalizedStart);
    var endSeconds=getClockSeconds(normalizedEnd);
    if(startSeconds===null||endSeconds===null)return normalizedStart;
    return startSeconds>endSeconds?normalizedEnd:normalizedStart;
}
function buildClockValueFromParts(parts){
    return pad(parts.hours)+':'+pad(parts.minutes)+':'+pad(parts.seconds);
}
function getAutoDayTimeMeta(dk,exercises){
    var firstAddedAt=null;
    var lastUpdatedAt=null;
    for(var i=0;i<exercises.length;i++){
        var exercise=exercises[i];
        var createdAt=projectTimestampToDateKey(dk,exercise.createdAt);
        var updatedAt=projectTimestampToDateKey(dk,exercise.updatedAt);
        if(createdAt!==null&&(firstAddedAt===null||createdAt<firstAddedAt))firstAddedAt=createdAt;
        var latestAt=updatedAt!==null?updatedAt:createdAt;
        if(latestAt!==null&&(lastUpdatedAt===null||latestAt>lastUpdatedAt))lastUpdatedAt=latestAt;
    }
    return {firstAddedAt:firstAddedAt,lastUpdatedAt:lastUpdatedAt};
}
function getDayTimeOverrideBucket(dk,muscle){
    var overrides=(dayTimeOverrides&&dayTimeOverrides[dk])||{};
    if(!muscle)return overrides;
    var muscleOverrides=overrides[muscle];
    if(muscleOverrides&&typeof muscleOverrides==='object')return muscleOverrides;
    return {};
}
function normalizeRefreshHistoryArray(dk,history){
    if(!Array.isArray(history))return [];
    var normalized=[];
    for(var hi=0;hi<history.length;hi++){
        var projectedTimestamp=projectTimestampToDateKey(dk,history[hi]);
        if(projectedTimestamp!==null)normalized.push(projectedTimestamp);
    }
    normalized.sort(function(a,b){return a-b;});
    return normalized;
}
function getDayTimeRefreshHistory(dk,muscle){
    return normalizeRefreshHistoryArray(dk,getDayTimeOverrideBucket(dk,muscle).refreshHistory);
}
function hasDayTimeOverrideValues(bucket){
    return normalizeTimestampValue(bucket&&bucket.firstAddedAt)!==null||normalizeTimestampValue(bucket&&bucket.lastUpdatedAt)!==null||(Array.isArray(bucket&&bucket.refreshHistory)&&bucket.refreshHistory.length>0);
}
function cleanupDayTimeOverridesForDate(dk){
    var dateOverrides=dayTimeOverrides[dk];
    if(!dateOverrides||typeof dateOverrides!=='object')return;
    var exercises=data[dk]||[];
    var hasAnyOverride=false;
    if(hasDayTimeOverrideValues(dateOverrides))hasAnyOverride=true;
    for(var overrideKey in dateOverrides){
        if(overrideKey==='firstAddedAt'||overrideKey==='lastUpdatedAt'||overrideKey==='refreshHistory')continue;
        var muscleOverrides=dateOverrides[overrideKey];
        var hasMuscleExercises=exercises.some(function(exercise){return exercise.muscle===overrideKey;});
        if(!hasMuscleExercises||!muscleOverrides||typeof muscleOverrides!=='object'||!hasDayTimeOverrideValues(muscleOverrides)){
            delete dateOverrides[overrideKey];
            continue;
        }
        hasAnyOverride=true;
    }
    if(!hasAnyOverride)delete dayTimeOverrides[dk];
}
function getDayTimeMeta(dk,exercises,muscle){
    if(!muscle){
        var groupedExercises={};
        for(var gi=0;gi<exercises.length;gi++){
            var groupedExercise=exercises[gi];
            if(!groupedExercise||!groupedExercise.muscle)continue;
            if(!groupedExercises[groupedExercise.muscle])groupedExercises[groupedExercise.muscle]=[];
            groupedExercises[groupedExercise.muscle].push(groupedExercise);
        }
        var earliestStart=null;
        var latestEnd=null;
        var earliestAutoStart=null;
        var latestAutoEnd=null;
        var earliestManualStart=null;
        var latestManualEnd=null;
        for(var groupedMuscle in groupedExercises){
            var groupedMeta=getDayTimeMeta(dk,groupedExercises[groupedMuscle],groupedMuscle);
            if(groupedMeta.firstAddedAt!==null&&(earliestStart===null||groupedMeta.firstAddedAt<earliestStart))earliestStart=groupedMeta.firstAddedAt;
            if(groupedMeta.lastUpdatedAt!==null&&(latestEnd===null||groupedMeta.lastUpdatedAt>latestEnd))latestEnd=groupedMeta.lastUpdatedAt;
            if(groupedMeta.autoFirstAddedAt!==null&&(earliestAutoStart===null||groupedMeta.autoFirstAddedAt<earliestAutoStart))earliestAutoStart=groupedMeta.autoFirstAddedAt;
            if(groupedMeta.autoLastUpdatedAt!==null&&(latestAutoEnd===null||groupedMeta.autoLastUpdatedAt>latestAutoEnd))latestAutoEnd=groupedMeta.autoLastUpdatedAt;
            if(groupedMeta.manualFirstAddedAt!==null&&(earliestManualStart===null||groupedMeta.manualFirstAddedAt<earliestManualStart))earliestManualStart=groupedMeta.manualFirstAddedAt;
            if(groupedMeta.manualLastUpdatedAt!==null&&(latestManualEnd===null||groupedMeta.manualLastUpdatedAt>latestManualEnd))latestManualEnd=groupedMeta.manualLastUpdatedAt;
        }
        if(earliestStart!==null||latestEnd!==null){
            return {
                firstAddedAt:earliestStart,
                lastUpdatedAt:latestEnd,
                autoFirstAddedAt:earliestAutoStart,
                autoLastUpdatedAt:latestAutoEnd,
                manualFirstAddedAt:earliestManualStart,
                manualLastUpdatedAt:latestManualEnd
            };
        }
    }
    var autoMeta=getAutoDayTimeMeta(dk,exercises);
    var overrides=getDayTimeOverrideBucket(dk,muscle);
    var manualFirstAddedAt=normalizeTimestampValue(overrides.firstAddedAt);
    var manualLastUpdatedAt=normalizeTimestampValue(overrides.lastUpdatedAt);
    var resolvedFirstAddedAt=manualFirstAddedAt!==null?manualFirstAddedAt:autoMeta.firstAddedAt;
    var resolvedLastUpdatedAt=manualLastUpdatedAt!==null?manualLastUpdatedAt:autoMeta.lastUpdatedAt;
    resolvedLastUpdatedAt=clampEndTimestampToSameDayRange(resolvedFirstAddedAt,resolvedLastUpdatedAt);
    return {
        firstAddedAt:resolvedFirstAddedAt,
        lastUpdatedAt:resolvedLastUpdatedAt,
        autoFirstAddedAt:autoMeta.firstAddedAt,
        autoLastUpdatedAt:autoMeta.lastUpdatedAt,
        manualFirstAddedAt:manualFirstAddedAt,
        manualLastUpdatedAt:manualLastUpdatedAt
    };
}
function calcTrainingDurationMinutes(dk,exercises,muscle){
    var timeMeta=getDayTimeMeta(dk,exercises,muscle);
    if(timeMeta.firstAddedAt===null||timeMeta.lastUpdatedAt===null)return null;
    var startSeconds=getClockSeconds(timeMeta.firstAddedAt);
    var endSeconds=getClockSeconds(timeMeta.lastUpdatedAt);
    if(startSeconds===null||endSeconds===null)return null;
    return Math.max(0,Math.round((endSeconds-startSeconds)/60));
}
function calcRefreshIntervalMinutes(currentTimestamp,previousTimestamp){
    if(currentTimestamp===null||previousTimestamp===null)return 0;
    var currentSeconds=getClockSeconds(currentTimestamp);
    var previousSeconds=getClockSeconds(previousTimestamp);
    if(currentSeconds===null||previousSeconds===null)return 0;
    return Math.max(0,Math.round((currentSeconds-previousSeconds)/6)/10);
}
function getMuscleRefreshIntervalSeries(dk,muscle,exercises){
    var timeMeta=getDayTimeMeta(dk,exercises,muscle);
    var refreshEntries=getDayTimeRefreshHistory(dk,muscle).map(function(timestamp){
        return {dk:dk,timestamp:timestamp};
    }).sort(function(a,b){return a.timestamp-b.timestamp;});
    var segments=[];
    var points=[];
    if(timeMeta.firstAddedAt===null)return {segments:segments,points:points};
    points.push({count:0,elapsedMinutes:0,timestamp:timeMeta.firstAddedAt});
    var previousTimestamp=timeMeta.firstAddedAt;
    for(var pi=0;pi<refreshEntries.length;pi++){
        var currentEntry=refreshEntries[pi];
        var intervalMinutes=calcRefreshIntervalMinutes(currentEntry.timestamp,previousTimestamp);
        var elapsedMinutes=calcRefreshIntervalMinutes(currentEntry.timestamp,timeMeta.firstAddedAt);
        if(intervalMinutes<1){
            previousTimestamp=currentEntry.timestamp;
            continue;
        }
        segments.push({
            fromIndex:pi,
            toIndex:pi+1,
            fromDateKey:dk,
            toDateKey:currentEntry.dk,
            fromTimestamp:previousTimestamp,
            toTimestamp:currentEntry.timestamp,
            intervalMinutes:intervalMinutes,
            vol:intervalMinutes
        });
        points.push({
            count:pi+1,
            elapsedMinutes:elapsedMinutes,
            timestamp:currentEntry.timestamp,
            segment:segments[segments.length-1]
        });
        previousTimestamp=currentEntry.timestamp;
    }
    return {segments:segments,points:points};
}
function formatTrainingDurationLabel(minutes){
    // Keep the label compact so it fits between the editable start/end time fields.
    if(minutes===null||minutes===undefined||isNaN(minutes))return '--';

function setDayTimeValue(dk,muscle,field,value){
    if(field!=='firstAddedAt'&&field!=='lastUpdatedAt')return;
    var exercises=(data[dk]||[]).filter(function(exercise){return !muscle||exercise.muscle===muscle;});
    if(!exercises.length)return;
    var nextTimestamp=value?getDayTimestampFromClockInput(dk,value):null;
    if(value&&nextTimestamp===null){
        alert('请输入 24 小时制时间，格式为 HH:MM:SS');
        showDetail(dk);
        return;
    }
    var meta=getDayTimeMeta(dk,exercises,muscle);
    if(!dayTimeOverrides[dk])dayTimeOverrides[dk]={};
    var targetOverrides=muscle?(dayTimeOverrides[dk][muscle]||(dayTimeOverrides[dk][muscle]={})):dayTimeOverrides[dk];
    if(nextTimestamp===null){
        delete targetOverrides[field];
    }else{
        targetOverrides[field]=nextTimestamp;
        if(field==='firstAddedAt'){
            targetOverrides.lastUpdatedAt=clampEndTimestampToSameDayRange(nextTimestamp,meta.lastUpdatedAt);
        }else if(field==='lastUpdatedAt'){
            targetOverrides.lastUpdatedAt=clampEndTimestampToSameDayRange(meta.firstAddedAt,nextTimestamp);
        }
    }
    cleanupDayTimeOverridesForDate(dk);
    saveDayTimeOverrides();
    showDetail(dk);
    if(document.getElementById('volumeContent').classList.contains('active'))showVolumeChart();
}
function setDayTimePart(dk,muscle,field,part,value){
    if(part!=='hours'&&part!=='minutes'&&part!=='seconds')return;
    var maxValue=part==='hours'?23:59;
    var trimmed=String(value==null?'':value).trim();
    if(trimmed==='')trimmed='0';
    if(!/^\d{1,2}$/.test(trimmed)){
        alert('请输入有效的时间数字');
        showDetail(dk);
        return;
    }
    var numericValue=parseInt(trimmed,10);
    if(isNaN(numericValue)||numericValue<0||numericValue>maxValue){
        alert(part==='hours'?'小时范围是 00-23':'分钟和秒范围是 00-59');
        showDetail(dk);
        return;
    }
    var exercises=(data[dk]||[]).filter(function(exercise){return !muscle||exercise.muscle===muscle;});
    var timeMeta=getDayTimeMeta(dk,exercises,muscle);
    var baseParts=getClockParts(timeMeta[field]);
    baseParts[part]=numericValue;
    setDayTimeValue(dk,muscle,field,buildClockValueFromParts(baseParts));
}
function updateDayLatestTimeForMuscle(dk,muscle,timestamp,shouldRecordRefreshHistory){
    var exercises=(data[dk]||[]).filter(function(exercise){return !muscle||exercise.muscle===muscle;});
    if(!exercises.length)return false;
    var timeMeta=getDayTimeMeta(dk,exercises,muscle);
    var nextTimestamp=timestamp==null?getNowTimestampForDateKey(dk):projectTimestampToDateKey(dk,timestamp);
    if(nextTimestamp===null)nextTimestamp=getNowTimestampForDateKey(dk);
    if(nextTimestamp===null)return false;
    var nextStartTimestamp=timeMeta.firstAddedAt;
    var startSeconds=getClockSeconds(timeMeta.firstAddedAt);
    var nowSeconds=getClockSeconds(nextTimestamp);
    if(startSeconds!==null&&nowSeconds!==null&&startSeconds>nowSeconds){
        nextStartTimestamp=nextTimestamp;
    }else{
        nextStartTimestamp=clampStartTimestampToSameDayRange(timeMeta.firstAddedAt,nextTimestamp);
    }
    if(!dayTimeOverrides[dk])dayTimeOverrides[dk]={};
    var targetOverrides=muscle?(dayTimeOverrides[dk][muscle]||(dayTimeOverrides[dk][muscle]={})):dayTimeOverrides[dk];
    if(nextStartTimestamp!==null)targetOverrides.firstAddedAt=nextStartTimestamp;
    targetOverrides.lastUpdatedAt=clampEndTimestampToSameDayRange(nextStartTimestamp,nextTimestamp);
    if(shouldRecordRefreshHistory){
        var refreshHistory=getDayTimeRefreshHistory(dk,muscle);
        refreshHistory.push(nextTimestamp);
        targetOverrides.refreshHistory=refreshHistory;
    }
    cleanupDayTimeOverridesForDate(dk);
    saveDayTimeOverrides();
    return true;
}
function refreshDayLatestTime(dk,muscle){
    if(!updateDayLatestTimeForMuscle(dk,muscle,null,true))return;
    resetRecordGroupTimer(dk,muscle);
    showDetail(dk);
    if(document.getElementById('volumeContent').classList.contains('active'))showVolumeChart();
}
function syncRecordGroupLatestTime(dk,muscle,timestamp){

}
function adjustDayTimePart(dk,field,part,delta){
    if(part!=='hours'&&part!=='minutes'&&part!=='seconds')return;
    var exercises=data[dk]||[];
    var timeMeta=getDayTimeMeta(dk,exercises);
    var baseParts=getClockParts(timeMeta[field]);
    var maxValue=part==='hours'?24:60;
    var currentValue=parseInt(baseParts[part],10)||0;
    baseParts[part]=(currentValue+delta+maxValue)%maxValue;
    setDayTimeValue(dk,field,buildClockValueFromParts(baseParts));
}
function getExerciseNamesFromData(m){
    var seen={};
    var names=[];
    var dateKeys=Object.keys(data).sort().reverse();
    for(var di=0;di<dateKeys.length;di++){
        var exercises=data[dateKeys[di]]||[];
        for(var ei=exercises.length-1;ei>=0;ei--){
            var exercise=exercises[ei];
            var name=(exercise.name||'').trim();
            if(exercise.muscle!==m||!name||seen[name])continue;
            seen[name]=true;
            names.push(name);
        }
    }
    return names;

function getExerciseHistoryDefaults(m,name){
    var bestMatch=null;
    var dateKeys=Object.keys(data).sort().reverse();
    for(var di=0;di<dateKeys.length;di++){
        var exercises=data[dateKeys[di]]||[];
        for(var ei=exercises.length-1;ei>=0;ei--){
            var exercise=exercises[ei];
            var exerciseName=(exercise.name||'').trim();
            if(exercise.muscle!==m||exerciseName!==name)continue;
            var weight=exercise.weight==null?null:Number(exercise.weight);
            if(weight===null||isNaN(weight))weight=null;
            if(!bestMatch||((weight||0)>(bestMatch.weight||0))){
                bestMatch={reps:exercise.reps||'',weight:weight};
            }
        }
    }
    return bestMatch;
}
function extractMaxRepsValue(repsText){
    var matches=String(repsText||'').match(/\d+(?:\.\d+)?/g);
    if(!matches||!matches.length)return 0;
    var maxValue=0;
    for(var i=0;i<matches.length;i++){
        var current=Number(matches[i]);
        if(!isNaN(current)&&current>maxValue)maxValue=current;
    }
    return maxValue;
}
function formatMetricNumber(value){
    if(value==null||isNaN(value)||value<=0)return '--';
    return Math.abs(value-Math.round(value))<0.001?String(Math.round(value)):String(value);
}
function formatMinuteDecimal(value){

}
function getLatestAddedActionItem(dk,items){
    var latestItem=null;
    var latestCreatedAt=null;
    for(var i=0;i<items.length;i++){
        var currentItem=items[i];
        var createdAt=projectTimestampToDateKey(dk,currentItem.exercise&&currentItem.exercise.createdAt);
        if(createdAt!==null&&(latestCreatedAt===null||createdAt>latestCreatedAt)){
            latestCreatedAt=createdAt;
            latestItem=currentItem;
            continue;
        }
        if(createdAt===latestCreatedAt&&latestItem&&currentItem.index>latestItem.index)latestItem=currentItem;
        if(createdAt===null&&!latestItem)latestItem=currentItem;
    }
    return latestItem||items[0]||null;
}
function getCapacityHintText(dk,items,bestRecord){
    var latestItem=getLatestAddedActionItem(dk,items);
    if(!latestItem||!latestItem.exercise)return '';
    var latestExercise=latestItem.exercise;
    var repsValue=extractMaxRepsValue(latestExercise.reps);
    var weightValue=latestExercise.weight==null?0:Number(latestExercise.weight);
    var bestVolume=bestRecord&&bestRecord.volume?bestRecord.volume:0;
    var currentActionVolume=0;
    for(var i=0;i<items.length;i++){
        currentActionVolume+=calcEntryVolume(items[i].exercise);
    }
    var currentSets=Math.max(1,Number(latestExercise.sets)||1);
    var neededSetsText='--';
    if(isNaN(weightValue))weightValue=0;
    if(bestVolume>0&&weightValue>0&&repsValue>0){
        var perSetVolume=weightValue*repsValue;
        var neededSets=Math.ceil(bestVolume/perSetVolume);
        neededSetsText=String(Math.max(currentSets,neededSets));
    }else if(bestVolume>0){
        neededSetsText=String(currentSets);
    }
    return '达标组数：<span class="exercise-capacity-hint-value">'+neededSetsText+'组</span>；最佳容量：<span class="exercise-capacity-hint-value">'+formatMetricNumber(bestVolume)+'</span>；当前容量：<span class="exercise-capacity-hint-value">'+formatMetricNumber(currentActionVolume)+'</span>';
}
function getExerciseBestRecord(m,name){
    var bestRecord=null;
    var exerciseMaxWeight=0;
    var dateKeys=Object.keys(data).sort();
    for(var di=0;di<dateKeys.length;di++){
        var exercises=data[dateKeys[di]]||[];
        for(var ei=0;ei<exercises.length;ei++){
            var exercise=exercises[ei];
            var exerciseName=(exercise.name||'').trim();
            if(exercise.muscle!==m||exerciseName!==name)continue;
            var weight=exercise.weight==null?0:Number(exercise.weight);
            var sets=Number(exercise.sets)||0;
            var repsText=exercise.reps||'';
            var volume=calcEntryVolume(exercise);
            if(isNaN(weight))weight=0;
            if(weight>exerciseMaxWeight||(weight===exerciseMaxWeight&&bestRecord&&volume>=bestRecord.volume)){
                exerciseMaxWeight=weight;
                bestRecord={
                    weight:weight,
                    sets:sets,
                    reps:repsText,
                    volume:volume,
                    date:dateKeys[di]
                };
            }
        }
    }

}

function getTodayKey(){
    var today=new Date();
    return today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
}
function formatSelectedDateLabel(dk){
    if(!dk)return '未选择日期';
    var parts=String(dk).split('-');
    if(parts.length!==3)return dk;
    return Number(parts[0])+'年 '+Number(parts[1])+'月 '+Number(parts[2])+'日';
}
function getRelativeSelectedDateLabel(dk){
    if(!dk)return '';
    var parts=String(dk).split('-');
    if(parts.length!==3)return '';
    var targetDate=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]));
    if(isNaN(targetDate.getTime()))return '';
    var now=new Date();
    var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    var targetDay=new Date(targetDate.getFullYear(),targetDate.getMonth(),targetDate.getDate());
    var diffDays=Math.round((targetDay.getTime()-today.getTime())/86400000);
    if(diffDays===0)return '今天';
    if(diffDays===-1)return '昨天';
    if(diffDays===-2)return '前天';
    if(diffDays===1)return '明天';
    if(diffDays===2)return '后天';
    return diffDays<0?Math.abs(diffDays)+' 天前':diffDays+' 天后';
}

function calcVolume(ex){
    var vol=0;
    for(var i=0;i<ex.length;i++){
        var e=ex[i];
        vol+=calcEntryVolume(e);
    }
    return vol;
}
function calcEntryVolume(exercise){
    if(!exercise)return 0;
    var reps=extractMaxRepsValue(exercise.reps);
    var weight=exercise.weight==null?0:Number(exercise.weight);
    var sets=Number(exercise.sets)||0;
    if(isNaN(weight))weight=0;
    return sets*reps*weight;
}
function getExerciseMaxWeightVolumeTarget(m,name){
    var maxWeight=0;
    var bestVolumeAtMaxWeight=0;
    var dateKeys=Object.keys(data);
    for(var di=0;di<dateKeys.length;di++){
        var exercises=data[dateKeys[di]]||[];
        for(var ei=0;ei<exercises.length;ei++){
            var exercise=exercises[ei];
            var exerciseName=(exercise.name||'').trim();
            if(exercise.muscle!==m||exerciseName!==name)continue;
            var weight=exercise.weight==null?0:Number(exercise.weight);
            if(isNaN(weight))weight=0;
            var volume=calcEntryVolume(exercise);
            if(weight>maxWeight){
                maxWeight=weight;
                bestVolumeAtMaxWeight=volume;
                continue;
            }
            if(weight===maxWeight&&volume>bestVolumeAtMaxWeight)bestVolumeAtMaxWeight=volume;
        }
    }
    return {maxWeight:maxWeight,bestVolume:bestVolumeAtMaxWeight};
}
function calcMaxWeight(ex){
    var maxWeight=0;
    for(var i=0;i<ex.length;i++){
        var weight=ex[i].weight||0;
        if(weight>maxWeight)maxWeight=weight;
    }
    return maxWeight;
}
function calcMaxWeightVolume(ex){
    var maxWeight=calcMaxWeight(ex);
    if(maxWeight<=0)return 0;
    var vol=0;
    for(var i=0;i<ex.length;i++){
        var e=ex[i];
        if((e.weight||0)!==maxWeight)continue;
        var reps=parseInt(e.reps)||0;
        vol+=e.sets*reps*maxWeight;
    }
    return vol;
}
function calcMaxWeightReps(ex){
    var maxWeight=calcMaxWeight(ex);
    if(maxWeight<=0)return 0;
    var maxReps=0;
    for(var i=0;i<ex.length;i++){
        var e=ex[i];
        if((e.weight||0)!==maxWeight)continue;
        var reps=extractMaxRepsValue(e.reps);
        if(reps>maxReps)maxReps=reps;
    }
    return maxReps;
}
function calcMaxWeightSets(ex){
    var maxWeight=calcMaxWeight(ex);
    if(maxWeight<=0)return 0;
    var maxSets=0;
    for(var i=0;i<ex.length;i++){
        var e=ex[i];
        if((e.weight||0)!==maxWeight)continue;
        var sets=Number(e.sets)||0;
        if(sets>maxSets)maxSets=sets;
    }
    return maxSets;
}
function getExerciseGroups(ex){
    var groups=[];
    var groupMap={};
    for(var i=ex.length-1;i>=0;i--){
        var e=ex[i];
        if(!groupMap[e.muscle]){
            groupMap[e.muscle]={muscle:e.muscle,actions:[],actionMap:{}};
            groups.push(groupMap[e.muscle]);
        }
        var muscleGroup=groupMap[e.muscle];
        if(!muscleGroup.actionMap[e.name]){
            muscleGroup.actionMap[e.name]={name:e.name,items:[]};
            muscleGroup.actions.push(muscleGroup.actionMap[e.name]);
        }
        muscleGroup.actionMap[e.name].items.push({index:i,exercise:e});
    }
    return groups;
}
function reorderExercisesByGroups(groups){
    var reordered=[];
    for(var gi=groups.length-1;gi>=0;gi--){
        var actions=groups[gi].actions;
        for(var ai=actions.length-1;ai>=0;ai--){
            var items=actions[ai].items;
            for(var ii=items.length-1;ii>=0;ii--){
                reordered.push(items[ii].exercise);
            }
        }
    }
    return reordered;
}

function renameExerciseAcrossData(targetMuscle,oldName,newName){
    var changed=false;
    for(var dk in data){
        var exercises=data[dk]||[];
        for(var i=0;i<exercises.length;i++){
            if(exercises[i].muscle===targetMuscle&&exercises[i].name===oldName){
                exercises[i].name=newName;
                changed=true;
            }
        }
    }
    if(!changed)return false;
    for(var tabKey in recordActionTabs){
        if(recordActionTabs[tabKey]===oldName&&tabKey.split('__')[1]===targetMuscle){
            recordActionTabs[tabKey]=newName;
        }
    }
    if(statsExerciseSelection[targetMuscle]===oldName){
        statsExerciseSelection[targetMuscle]=newName;
    }
    var customNames=getCustomExerciseNames(targetMuscle).slice();
    var customNameIdx=customNames.indexOf(oldName);
    if(customNameIdx>=0){
        if(customNames.indexOf(newName)<0){
            customNames[customNameIdx]=newName;
        }else{
            customNames.splice(customNameIdx,1);
        }
        customExerciseNames[targetMuscle]=customNames;
        saveCustomExerciseNames();
    }
    if(selDate&&data[selDate])showDetail(selDate);
    if(selMuscle===targetMuscle){
        fillExerciseNameOptions(targetMuscle);
        var exerciseNameInput=document.getElementById('exerciseName');
        if(exerciseNameInput&&exerciseNameInput.value===oldName){
            exerciseNameInput.value=newName;
        }
    }
    return true;
}

function setWeightValue(dk,i,val){
    var prevValue=data[dk][i].weight==null?null:Number(data[dk][i].weight);
    var nextValue=val===''?null:parseFloat(val);
    if(nextValue!==null&&isNaN(nextValue))return;
    data[dk][i].weight=nextValue===null?null:Math.max(0,nextValue);
    var updatedAt=getNowTimestampForDateKey(dk);
    data[dk][i].updatedAt=updatedAt;
    var finalValue=data[dk][i].weight==null?null:Number(data[dk][i].weight);
    var setsPatched=finalValue!==prevValue?resetExerciseSetsOnWeightChange(data[dk][i]):false;
    if(finalValue!==prevValue)markRecordValueFlash(dk,i,'weight',finalValue!==null&&prevValue!==null&&finalValue<prevValue?'down':'up');
    if(finalValue!==prevValue||setsPatched){
        syncRecordGroupLatestTime(dk,data[dk][i].muscle,updatedAt);
        resetRecordGroupTimer(dk,data[dk][i].muscle);
    }
    save();

    for(var gi=0;gi<=4;gi++){
        var gridY=padding.top+chartH*gi/4;
        htm+='<line class="chart-grid" x1="'+padding.left+'" y1="'+gridY+'" x2="'+(width-padding.right)+'" y2="'+gridY+'"/>';
        var axisVal=Math.round((axisMin+axisRange*(4-gi)/4)*10)/10;
        htm+='<text class="chart-axis" x="'+(padding.left-5)+'" y="'+(gridY+4)+'" text-anchor="end">'+axisVal+'</text>';
    }
    for(var xi=0;xi<xLabels.length;xi++){
        var xLabel=padding.left+chartW*xi/(xLabels.length-1||1);
        htm+='<text class="chart-axis" x="'+xLabel+'" y="'+(height-10)+'" text-anchor="middle">'+xLabels[xi]+'</text>';
    }
    if(displayedMinVol!==Infinity&&volumeMetricMode!=='interval'){
        var maxGuideY=padding.top+chartH*(1-(displayedMaxVol-axisMin)/axisRange);
        var minGuideY=padding.top+chartH*(1-(displayedMinVol-axisMin)/axisRange);
        htm+='<line class="chart-guide-line chart-guide-max" x1="'+padding.left+'" y1="'+maxGuideY+'" x2="'+(width-padding.right)+'" y2="'+maxGuideY+'"/>';
        htm+='<text class="chart-guide-label chart-guide-label-max" x="'+(width-padding.right-2)+'" y="'+(maxGuideY-4)+'" text-anchor="end">MAX '+displayedMaxVol+'</text>';
        htm+='<line class="chart-guide-line chart-guide-min" x1="'+padding.left+'" y1="'+minGuideY+'" x2="'+(width-padding.right)+'" y2="'+minGuideY+'"/>';
        htm+='<text class="chart-guide-label chart-guide-label-min" x="'+(width-padding.right-2)+'" y="'+(minGuideY+14)+'" text-anchor="end">MIN '+displayedMinVol+'</text>';
    }

    var chartRiseColor='#ff3b30';
    var chartFallColor='#34c759';
    if(volumeMetricMode==='interval'){
        for(var segi=1;segi<intervalPoints.length;segi++){
            var prevPoint=intervalPoints[segi-1];
            var currPoint=intervalPoints[segi];
            var segment=currPoint.segment;
            var startX=padding.left+chartW*(segi-1)/(intervalPoints.length-1||1);
            var endX=padding.left+chartW*segi/(intervalPoints.length-1||1);
            var startY=padding.top+chartH*(1-(prevPoint.elapsedMinutes-axisMin)/axisRange);
            var endY=padding.top+chartH*(1-(currPoint.elapsedMinutes-axisMin)/axisRange);
            htm+='<path class="chart-line" stroke="'+chartRiseColor+'" d="M'+startX+' '+startY+' L'+endX+' '+endY+'"/>';
            htm+='<text class="chart-segment-label" x="'+((startX+endX)/2)+'" y="'+Math.max(padding.top+10,((startY+endY)/2)-6)+'">'+formatMinuteDecimal(segment.intervalMinutes)+'分</text>';
        }
        for(var ipi=0;ipi<intervalPoints.length;ipi++){
            var point=intervalPoints[ipi];
            var pointX=padding.left+chartW*ipi/(intervalPoints.length-1||1);
            var pointY=padding.top+chartH*(1-(point.elapsedMinutes-axisMin)/axisRange);
            var pointTitle=ipi===0
                ? '0次刷新 · 0.0分钟'
                : ('第'+point.segment.toIndex+'次刷新 · 累计训练时长 '+formatMinuteDecimal(point.elapsedMinutes)+'分钟');
            var pointDateLabel=ipi===0
                ? '0次'
                : ('第'+point.segment.toIndex+'次刷新 · '+point.segment.toDateKey+' '+formatClockTime(point.segment.toTimestamp));
            htm+='<circle class="chart-point'+(ipi===intervalPoints.length-1?' chart-point-max':'')+'" cx="'+pointX+'" cy="'+pointY+'" r="4" fill="'+muscleColors[selectedMuscle]+'" data-muscle="'+selectedMuscle+'" data-date="'+pointDateLabel+'" data-vol="'+formatMinuteDecimal(point.elapsedMinutes)+'" data-unit="分钟"><title>'+pointTitle+'</title></circle>';
            if(ipi===intervalPoints.length-1){
                htm+='<text class="chart-point-label" x="'+pointX+'" y="'+Math.max(padding.top-2,pointY-10)+'">'+formatMinuteDecimal(point.elapsedMinutes)+'分</text>';
            }
        }
    }
    for(var key in seriesMap){
        var pts=seriesMap[key];
        if(!pts.length)continue;
        if(pts.length>1){
            if(selectedMuscle==='all'){
                var pathD='';
                for(var pi=0;pi<pts.length;pi++){
                    var allIdx=dates.indexOf(pts[pi].dk);
                    var allX=padding.left+chartW*allIdx/(xLabels.length-1||1);
                    var allY=padding.top+chartH*(1-(pts[pi].vol-axisMin)/axisRange);
                    pathD+=(pi===0?'M':' L')+allX+' '+allY;
                }
                htm+='<path class="chart-line" stroke="'+muscleColors[key]+'" d="'+pathD+'" data-muscle="'+key+'" style="opacity:1"/>';
            }else{
                for(var pi2=1;pi2<pts.length;pi2++){
                    var prevX=padding.left+chartW*(pi2-1)/(pts.length-1||1);
                    var prevY=padding.top+chartH*(1-(pts[pi2-1].vol-axisMin)/axisRange);
                    var currX=padding.left+chartW*pi2/(pts.length-1||1);
                    var currY=padding.top+chartH*(1-(pts[pi2].vol-axisMin)/axisRange);
                    var segmentColor=pts[pi2].vol>=pts[pi2-1].vol?chartRiseColor:chartFallColor;
                    htm+='<path class="chart-line" stroke="'+segmentColor+'" d="M'+prevX+' '+prevY+' L'+currX+' '+currY+'"/>';
                }
            }
        }
        for(var pj=0;pj<pts.length;pj++){
            var pointX=selectedMuscle==='all'
                ? padding.left+chartW*dates.indexOf(pts[pj].dk)/(xLabels.length-1||1)
                : padding.left+chartW*pj/(pts.length-1||1);
            var pointY=padding.top+chartH*(1-(pts[pj].vol-axisMin)/axisRange);
            var isLastPoint=pj===pts.length-1;
            var isMaxPoint=pts[pj].vol===displayedMaxVol;
            var pointR=selectedMuscle==='all'?(isMaxPoint?4:3):(isMaxPoint?5:4);
            var metricSuffix=volumeMetricMode==='maxWeight'?'kg':volumeMetricMode==='maxSets'?'组':volumeMetricMode==='maxReps'?'kg':volumeMetricMode==='duration'?'分钟':volumeMetricMode==='interval'?'分钟':'kg';
            var pointLabelDate=volumeMetricMode==='interval'
                ? ('第'+pts[pj].index+'次 · '+pts[pj].dk+' '+formatClockTime(pts[pj].timestamp))
                : pts[pj].dk;
            var pointTitle=volumeMetricMode==='duration'
                ? pts[pj].dk.split('-')[2]+'日: '+pts[pj].vol+metricSuffix
                : volumeMetricMode==='interval'
                ? ('第'+pts[pj].index+'次刷新 · '+pts[pj].dk+' '+formatClockTime(pts[pj].timestamp)+' · 间隔 '+pts[pj].intervalMinutes+metricSuffix)
                : (selectedMuscle==='all'?getMuscleIconText(key)+' '+muscleNames[key]+' · ':((selectedExercise&&selectedMuscle!=='all')?selectedExercise+' · ':'' )+pts[pj].dk.split('-')[2]+'日: ')+pts[pj].vol+metricSuffix;
            htm+='<circle class="chart-point'+(isMaxPoint?' chart-point-max':'')+'" cx="'+pointX+'" cy="'+pointY+'" r="'+pointR+'"'+(isMaxPoint||volumeMetricMode==='duration'?'':' fill="'+muscleColors[key]+'"')+' data-muscle="'+key+'" data-date="'+pointLabelDate+'" data-vol="'+pts[pj].vol+'" data-unit="'+metricSuffix+'"><title>'+pointTitle+'</title></circle>';
            if(isLastPoint){
                htm+='<text class="chart-point-label" x="'+pointX+'" y="'+Math.max(padding.top-2,pointY-10)+'">'+formatMetricNumber(pts[pj].vol)+(volumeMetricMode==='interval'?'分':'')+'</text>';
            }
        }
    }
    htm+='</svg></div>';
    htm+='<div class="chart-footer">'+
        '<div class="chart-mode-pill">'+
            '<button class="chart-mode-toggle'+(volumeMetricMode==='interval'?' active':'')+'" onclick="setVolumeMetricMode(\'interval\')">每组间隔</button>'+
            '<button class="chart-mode-toggle'+(volumeMetricMode==='maxReps'?' active':'')+'" onclick="setVolumeMetricMode(\'maxReps\')">部位总容量</button>'+
            '<button class="chart-mode-toggle'+(volumeMetricMode==='total'?' active':'')+'" onclick="setVolumeMetricMode(\'total\')">最大容量</button>'+
            '<button class="chart-mode-toggle'+(volumeMetricMode==='maxWeight'?' active':'')+'" onclick="setVolumeMetricMode(\'maxWeight\')">最大重量</button>'+
            '<button class="chart-mode-toggle'+(volumeMetricMode==='maxSets'?' active':'')+'" onclick="setVolumeMetricMode(\'maxSets\')">最大组数</button>'+
            '<button class="chart-mode-toggle'+(volumeMetricMode==='duration'?' active':'')+'" onclick="setVolumeMetricMode(\'duration\')">训练时长</button>'+
        '</div>'+
    '</div>';
    container.innerHTML=htm;
    bindChartPointTooltips();
}
function hideChartTooltip(){
    var tooltip=document.querySelector('#chartContainer .chart-tooltip');
    if(tooltip)tooltip.remove();
}
function bindChartPointTooltips(){
    var chart=document.querySelector('#chartContainer .line-chart');
    if(!chart)return;
    chart.onclick=function(e){
        if(!e.target.classList.contains('chart-point'))hideChartTooltip();
    };
    chart.querySelectorAll('.chart-point').forEach(function(point){
        point.onclick=function(e){
            e.stopPropagation();
            hideChartTooltip();
            var tooltip=document.createElement('div');
            var mu=this.dataset.muscle;
            var date=this.dataset.date||'';
            var vol=this.dataset.vol||'0';
            var unit=this.dataset.unit||'kg';
            tooltip.className='chart-tooltip';
            tooltip.textContent=(mu&&muscleNames[mu]?getMuscleIconText(mu)+' '+muscleNames[mu]+' · ':'')+date+' · '+vol+unit;
            chart.appendChild(tooltip);
            var chartRect=chart.getBoundingClientRect();
            var pointRect=this.getBoundingClientRect();
            var left=pointRect.left-chartRect.left-tooltip.offsetWidth/2+pointRect.width/2;
            var top=pointRect.top-chartRect.top-tooltip.offsetHeight-8;
            var maxLeft=chart.clientWidth-tooltip.offsetWidth;
            tooltip.style.left=Math.max(0,Math.min(left,maxLeft))+'px';
            tooltip.style.top=Math.max(0,top)+'px';
        };
    });
}

var muscleColors={chest:'#ff8a4c',back:'#5b6cff',shoulder:'#8a63ff',leg:'#2fb59f',biceps:'#3aa0ff',triceps:'#4d7dff',core:'#ffb340',cardio:'#ff5f57'};
function escapeHtml(str){
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function calcMuscleStats(mu){
    var maxWeight=0,maxRecord=null,maxDailyVol=0,maxDailyDate='';
    var milestones=[];
    var exerciseMilestones={};
    var exerciseMaxWeights={};
    var dateKeys=Object.keys(data).sort();
    for(var di=0;di<dateKeys.length;di++){
        var dk=dateKeys[di];
        var exs=data[dk];
        var dayVol=0;
        for(var i=0;i<exs.length;i++){
            var e=exs[i];
            if(e.muscle!==mu)continue;
            var reps=parseInt(e.reps)||0;
            var w=e.weight||0;
            var mvol=e.sets*reps*w;
            if(!exerciseMilestones[e.name])exerciseMilestones[e.name]=[];
            if(w>maxWeight||(w===maxWeight&&maxRecord&&mvol>=((Number(maxRecord.sets)||0)*(parseInt(maxRecord.reps)||0)*(Number(maxRecord.weight)||0)))){
                maxWeight=w;
                maxRecord={name:e.name,sets:e.sets,reps:e.reps,weight:w,date:dk};
                milestones.push({weight:w,date:dk});
            }
            var exerciseTop=exerciseMilestones[e.name].length?exerciseMilestones[e.name][exerciseMilestones[e.name].length-1]:null;
            var exerciseTopVolume=exerciseTop?((Number(exerciseTop.sets)||0)*(parseInt(exerciseTop.reps)||0)*(Number(exerciseTop.weight)||0)):0;
            if(w>(exerciseMaxWeights[e.name]||0)||(w===(exerciseMaxWeights[e.name]||0)&&mvol>=exerciseTopVolume)){
                exerciseMaxWeights[e.name]=w;
                if(exerciseTop&&w===(exerciseTop.weight||0))exerciseMilestones[e.name][exerciseMilestones[e.name].length-1]={date:dk,weight:w,sets:e.sets,reps:e.reps};
                else exerciseMilestones[e.name].push({date:dk,weight:w,sets:e.sets,reps:e.reps});
            }
            dayVol+=mvol;
        }
        if(dayVol>maxDailyVol){
            maxDailyVol=dayVol;
            maxDailyDate=dk;
        }
    }
    return {maxWeight:maxWeight,maxRecord:maxRecord,maxDailyVol:maxDailyVol,maxDailyDate:maxDailyDate,milestones:milestones,exerciseMilestones:exerciseMilestones};
}
function getMonthDays(y,m){
    return new Date(y,m+1,0).getDate();
}
function isLeapYear(y){
    return (y%4===0&&y%100!==0)||y%400===0;
}
function getYearDays(y){
    return isLeapYear(y)?366:365;
}
function generateSummaryMarkdown(){
    var dateKeys=Object.keys(data).sort();
    if(!dateKeys.length)return '# 健身数据总结\n\n暂无训练数据。';
    var allMuscles=['chest','back','shoulder','leg','biceps','triceps','core','cardio'];
    var summaryByMuscle={};
    var exerciseSummary={};
    var monthSummary={};
    var dailySummary={};
    var totalEntries=0,totalSets=0,totalVolume=0,totalWeightEntries=0,totalWeight=0;
    var maxWeightRecord=null;
    for(var ai=0;ai<allMuscles.length;ai++){
        summaryByMuscle[allMuscles[ai]]={days:{},entries:0,maxWeight:0,totalSets:0,totalVolume:0};
    }
    for(var di=0;di<dateKeys.length;di++){
        var dk=dateKeys[di];
        var exs=data[dk]||[];
        var monthKey=dk.slice(0,7);
        if(!monthSummary[monthKey])monthSummary[monthKey]={days:{},entries:0,totalSets:0,totalVolume:0,maxWeight:0};
        if(!dailySummary[dk])dailySummary[dk]={entries:0,totalSets:0,totalVolume:0,muscles:{},names:[]};
        for(var i=0;i<exs.length;i++){
            var e=exs[i];
            var sets=parseInt(e.sets)||0;
            var reps=parseInt(e.reps)||0;
            var weight=e.weight||0;
            var volume=sets*reps*weight;
            totalEntries++;
            totalSets+=sets;
            totalVolume+=volume;
            if(weight>0){totalWeightEntries++;totalWeight+=weight;}
            if(!summaryByMuscle[e.muscle])summaryByMuscle[e.muscle]={days:{},entries:0,maxWeight:0,totalSets:0,totalVolume:0};
            summaryByMuscle[e.muscle].days[dk]=true;
            summaryByMuscle[e.muscle].entries++;
            summaryByMuscle[e.muscle].totalSets+=sets;
            summaryByMuscle[e.muscle].totalVolume+=volume;
            if(weight>summaryByMuscle[e.muscle].maxWeight)summaryByMuscle[e.muscle].maxWeight=weight;
            if(!exerciseSummary[e.name])exerciseSummary[e.name]={muscle:e.muscle,count:0,maxWeight:0,lastDate:dk,totalSets:0,totalVolume:0};
            exerciseSummary[e.name].count++;
            exerciseSummary[e.name].lastDate=dk;
            exerciseSummary[e.name].totalSets+=sets;
            exerciseSummary[e.name].totalVolume+=volume;
            if(weight>exerciseSummary[e.name].maxWeight)exerciseSummary[e.name].maxWeight=weight;
            monthSummary[monthKey].days[dk]=true;
            monthSummary[monthKey].entries++;
            monthSummary[monthKey].totalSets+=sets;
            monthSummary[monthKey].totalVolume+=volume;
            if(weight>monthSummary[monthKey].maxWeight)monthSummary[monthKey].maxWeight=weight;
            dailySummary[dk].entries++;
            dailySummary[dk].totalSets+=sets;
            dailySummary[dk].totalVolume+=volume;
            dailySummary[dk].muscles[e.muscle]=true;
            dailySummary[dk].names.push(e.name);
            if(weight>0&&(!maxWeightRecord||weight>maxWeightRecord.weight)){
                maxWeightRecord={name:e.name,muscle:e.muscle,weight:weight,date:dk};
            }
        }
    }
    var firstDate=new Date(dateKeys[0]);
    var lastDate=new Date(dateKeys[dateKeys.length-1]);
    var spanDays=Math.max(1,Math.round((lastDate-firstDate)/86400000)+1);
    var avgEntriesPerDay=(totalEntries/dateKeys.length).toFixed(1);
    var avgVolumePerDay=Math.round(totalVolume/dateKeys.length);
    var avgWeight=totalWeightEntries?Math.round(totalWeight/totalWeightEntries*10)/10:0;
    var longestStreak=0,currentStreak=0,streak=0,previousTime=null;
    var todayKey=curDate.getFullYear()+'-'+pad(curDate.getMonth()+1)+'-'+pad(curDate.getDate());
    for(var si=0;si<dateKeys.length;si++){
        var currentTime=new Date(dateKeys[si]).getTime();
        if(previousTime!==null&&currentTime-previousTime===86400000){
            streak++;
        }else{
            streak=1;
        }
        if(streak>longestStreak)longestStreak=streak;
        previousTime=currentTime;
    }
    currentStreak=0;
    var cursor=new Date(todayKey+'T00:00:00');
    while(true){
        var key=cursor.getFullYear()+'-'+pad(cursor.getMonth()+1)+'-'+pad(cursor.getDate());
        if(!data[key])break;
        currentStreak++;
        cursor.setDate(cursor.getDate()-1);
    }
    var monthKeys=Object.keys(monthSummary).sort();
    var currentMonthKey=curDate.getFullYear()+'-'+pad(curDate.getMonth()+1);
    var currentMonthDays=monthSummary[currentMonthKey]?Object.keys(monthSummary[currentMonthKey].days).length:0;
    var currentMonthEntries=monthSummary[currentMonthKey]?monthSummary[currentMonthKey].entries:0;
    var currentMonthVolume=monthSummary[currentMonthKey]?Math.round(monthSummary[currentMonthKey].totalVolume):0;
    var currentMonthAttendance=Math.round(currentMonthDays/Math.max(1,getMonthDays(curDate.getFullYear(),curDate.getMonth()))*100);
    var lines=[];
    lines.push('# 健身数据总结');
    lines.push('');
    lines.push('统计区间：'+dateKeys[0]+' ~ '+dateKeys[dateKeys.length-1]+'（跨度 '+spanDays+' 天）');
    lines.push('');
    for(var mi=0;mi<allMuscles.length;mi++){
        var mu=allMuscles[mi];
        var item=summaryByMuscle[mu];
        if(!item||!item.entries)continue;
        var muscleExerciseNames=Object.keys(exerciseSummary).filter(function(name){
            return exerciseSummary[name].muscle===mu;
        });
        var muscleTopPr=muscleExerciseNames.slice().sort(function(a,b){
            if(exerciseSummary[b].maxWeight!==exerciseSummary[a].maxWeight)return exerciseSummary[b].maxWeight-exerciseSummary[a].maxWeight;
            return exerciseSummary[b].count-exerciseSummary[a].count;
        }).slice(0,3);
        var muscleTopFreq=muscleExerciseNames.slice().sort(function(a,b){
            if(exerciseSummary[b].count!==exerciseSummary[a].count)return exerciseSummary[b].count-exerciseSummary[a].count;
            return exerciseSummary[b].totalVolume-exerciseSummary[a].totalVolume;
        }).slice(0,3);
        var muscleRecentDays=dateKeys.filter(function(dk){
            var exs=data[dk]||[];
            for(var i=0;i<exs.length;i++){
                if(exs[i].muscle===mu)return true;
            }
            return false;
        }).slice(-5).reverse();
        var muscleBestDay='暂无';
        var muscleBestDayVolume=0;
        for(var mdi=0;mdi<muscleRecentDays.length;mdi++){
            var dayKey=muscleRecentDays[mdi];
            var exs=data[dayKey]||[];
            var dayVol=0;
            for(var exi=0;exi<exs.length;exi++){
                if(exs[exi].muscle!==mu)continue;
                dayVol+=(parseInt(exs[exi].sets)||0)*(parseInt(exs[exi].reps)||0)*(exs[exi].weight||0);
            }
            if(dayVol>muscleBestDayVolume){
                muscleBestDayVolume=dayVol;
                muscleBestDay=dayKey;
            }
        }
        lines.push('## '+getMuscleIconText(mu)+' '+(muscleNames[mu]||mu));
        lines.push('');
        lines.push('- 训练天数：'+Object.keys(item.days).length+' 天');
        lines.push('- 动作记录：'+item.entries+' 条');
        lines.push('- 累计组数：'+item.totalSets+' 组');
        lines.push('- 累计容量：'+Math.round(item.totalVolume)+' kg');
        lines.push('- 最大重量：'+item.maxWeight+' kg');
        lines.push('- 涉及动作：'+muscleExerciseNames.length+' 个');
        lines.push('- 最强单日：'+muscleBestDay+' · '+Math.round(muscleBestDayVolume)+' kg');
        lines.push('');
        lines.push('### PR 动作');
        lines.push('');
        if(muscleTopPr.length){
            for(var pi=0;pi<muscleTopPr.length;pi++){
                var prName=muscleTopPr[pi];
                var prItem=exerciseSummary[prName];
                lines.push((pi+1)+'. '+prName+' - '+prItem.maxWeight+' kg，'+prItem.count+' 次，最近：'+prItem.lastDate);
            }
        }else{
            lines.push('- 暂无 PR 动作数据');
        }
        lines.push('');
        lines.push('### 高频动作');
        lines.push('');
        if(muscleTopFreq.length){
            for(var fi=0;fi<muscleTopFreq.length;fi++){
                var freqName=muscleTopFreq[fi];
                var freqItem=exerciseSummary[freqName];
                lines.push((fi+1)+'. '+freqName+' - '+freqItem.count+' 次，'+freqItem.totalSets+' 组，'+Math.round(freqItem.totalVolume)+' kg');
            }
        }else{
            lines.push('- 暂无高频动作数据');
        }
        lines.push('');
        lines.push('### 最近训练');
        lines.push('');
        if(muscleRecentDays.length){
            for(var ri=0;ri<muscleRecentDays.length;ri++){
                var recentDayKey=muscleRecentDays[ri];
                var recentExs=(data[recentDayKey]||[]).filter(function(e){return e.muscle===mu;});
                var recentNames=recentExs.map(function(e){return e.name;});
                var recentSets=0;
                var recentVol=0;
                for(var rj=0;rj<recentExs.length;rj++){
                    recentSets+=(parseInt(recentExs[rj].sets)||0);
                    recentVol+=(parseInt(recentExs[rj].sets)||0)*(parseInt(recentExs[rj].reps)||0)*(recentExs[rj].weight||0);
                }
                lines.push('- '+recentDayKey+'：'+recentNames.join('、')+' | '+recentExs.length+' 条动作 | '+recentSets+' 组 | '+Math.round(recentVol)+' kg');
            }
        }else{
            lines.push('- 暂无最近训练数据');
        }
        lines.push('');
    }
    return lines.join('\n');
}
