<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0071e3">
    <title>健身月历</title>
    <style>
        :root {
            --accent: #0071e3;
            --accent-soft: rgba(0, 113, 227, 0.12);
            --accent-soft-strong: rgba(0, 113, 227, 0.2);
            --accent-bright: #59b7ff;
            --accent-mid: #2997ff;
            --accent-deep: #0058b0;
            --bg: #f5f5f7;
            --bg-2: #eef1f5;
            --bg-3: #e6ebf2;
            --card: rgba(255, 255, 255, 0.76);
            --card-strong: rgba(255, 255, 255, 0.92);
            --surface-top: rgba(255,255,255,0.96);
            --surface-mid: rgba(245,247,250,0.88);
            --surface-bot: rgba(229,234,241,0.78);
            --text: #1d1d1f;
            --muted: #6e6e73;
            --line: rgba(29, 29, 31, 0.08);
            --glass-line: rgba(255, 255, 255, 0.72);
            --glass-shadow: inset 0 1px 0 rgba(255,255,255,0.88), inset 0 -1px 0 rgba(255,255,255,0.22);
            --shadow: 0 16px 40px rgba(17, 24, 39, 0.08);
            --shadow-deep: 0 24px 56px rgba(17, 24, 39, 0.14);
            --shadow-lift: 0 14px 28px rgba(17, 24, 39, 0.1), 0 3px 10px rgba(17, 24, 39, 0.05);
            --highlight: inset 0 1px 0 rgba(255,255,255,0.96), inset 0 -10px 18px rgba(255,255,255,0.1);
            --primary-gradient: linear-gradient(180deg, var(--accent-bright) 0%, var(--accent-mid) 52%, var(--accent-deep) 100%);
            --neutral-gradient: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(241,244,248,0.92) 100%);
            --danger-top: #ff8f86;
            --danger-mid: #ff5f57;
            --danger-bottom: #d9342b;
            --today-ring: rgba(48, 209, 88, 0.88);
            --today-glow: rgba(48, 209, 88, 0.16);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: radial-gradient(circle at top left, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 30%), radial-gradient(circle at top right, rgba(90,181,255,0.14) 0%, rgba(90,181,255,0) 32%), radial-gradient(circle at center top, rgba(255,255,255,0.76) 0%, rgba(255,255,255,0) 44%), linear-gradient(180deg, #fbfbfd 0%, var(--bg) 22%, var(--bg-2) 58%, var(--bg-3) 100%); min-height: 100vh; color: var(--text); padding-bottom: 20px; position: relative; overflow-x: hidden; }
        body::before { content: ''; position: fixed; inset: -12% -10% auto; height: 38vh; background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.35) 28%, rgba(255,255,255,0) 72%); pointer-events: none; z-index: 0; }
        body::after { content: ''; position: fixed; right: -70px; bottom: 10vh; width: 220px; height: 220px; background: radial-gradient(circle, rgba(41,151,255,0.14) 0%, rgba(41,151,255,0.03) 44%, rgba(41,151,255,0) 76%); filter: blur(12px); pointer-events: none; z-index: 0; }
        .header { background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(250,250,252,0.78) 100%); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border-bottom: 1px solid var(--glass-line); padding: 10px 0; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--highlight), 0 12px 30px rgba(17,24,39,0.1), 0 2px 0 rgba(255,255,255,0.92); }
        .header h1 { font-size: 18px; font-weight: 600; color: var(--text); }
        .header-action { position: absolute; top: 50%; transform: translateY(-50%); background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(243,246,250,0.9) 100%); border: 1px solid rgba(255,255,255,0.82); color: var(--accent); padding: 3px 8px; border-radius: 8px; cursor: pointer; font-size: 9px; font-weight: 700; box-shadow: inset 0 1px 0 rgba(255,255,255,0.94), 0 8px 14px rgba(17,24,39,0.06); }
        .header-action.left { left: 15px; }
        .header-action.right { right: 15px; }
        .header-action:active { transform: translateY(calc(-50% + 1px)); }
        #importFile { display: none; }
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 0 6px; margin: 10px 5px 4px; border-radius: 10px; background: linear-gradient(180deg, rgba(255,255,255,0.78) 0%, rgba(242,244,248,0.62) 100%); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.72); box-shadow: var(--highlight), var(--shadow-lift); position: relative; z-index: 1; }
        .nav button { background: var(--primary-gradient); border: 1px solid rgba(255,255,255,0.42); color: white; padding: 2px 10px; border-radius: 10px; font-size: 12px; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.38), inset 0 -2px 0 rgba(0,88,176,0.24), 0 8px 14px rgba(0,113,227,0.2); transition: transform 0.2s, box-shadow 0.2s; }
        .nav button:active { transform: translateY(2px) scale(0.97); box-shadow: inset 0 1px 0 rgba(255,255,255,0.32), 0 4px 10px rgba(0,113,227,0.16); }
        .nav .month-year { font-size: 13px; font-weight: 600; color: var(--text); }
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; padding: 0 5px; position: relative; z-index: 1; }
        .weekday { text-align: center; padding: 10px 5px; font-weight: 600; color: var(--accent); font-size: 14px; }
        .day { aspect-ratio: 1.1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; background: linear-gradient(180deg, var(--surface-top) 0%, var(--surface-mid) 42%, var(--surface-bot) 100%); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.82); border-radius: 15px; padding: 2px 2px; cursor: pointer; min-height: 45px; box-shadow: var(--highlight), 0 10px 18px rgba(17,24,39,0.08), 0 2px 0 rgba(255,255,255,0.9); overflow: hidden; transform: translateY(0); transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease; }
        .day:hover { background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(248,250,253,0.92) 44%, rgba(232,238,246,0.82) 100%); box-shadow: var(--highlight), 0 16px 26px rgba(17,24,39,0.12), 0 2px 0 rgba(255,255,255,0.9); transform: translateY(-3px); }
        .day.empty { background: transparent; cursor: default; box-shadow: none; }
        .day.today { border-color: rgba(255,255,255,0.82); background: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(235,250,240,0.98) 42%, rgba(48,209,88,0.16) 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.92), inset 0 -10px 18px rgba(48,209,88,0.06), 0 0 0 2px var(--today-ring), 0 14px 24px var(--today-glow); }
        .day.selected { background: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(236,245,255,0.98) 42%, rgba(0,113,227,0.2) 100%); border-color: rgba(255,255,255,0.82); box-shadow: inset 0 1px 0 rgba(255,255,255,0.94), inset 0 -10px 18px rgba(0,113,227,0.06), 0 0 0 2px rgba(0,113,227,0.82), 0 18px 28px rgba(0,113,227,0.16); transform: translateY(-2px); }
        .day-number { font-size: 11px; font-weight: 700; margin-bottom: 1px; line-height: 1; flex-shrink: 0; width: 100%; text-align: center; }
        .day-icons { display: flex; flex: 1; flex-wrap: wrap; gap: 2px; justify-content: center; align-items: center; align-content: center; width: 100%; max-height: none; overflow: hidden; }
        .day-icons.count-3,
        .day-icons.count-4,
        .day-icons.count-5,
        .day-icons.count-6,
        .day-icons.count-7 { gap: 1px; padding-top: 1px; }
        .day-volume { font-size: 8px; color: var(--accent); margin-top: 1px; font-weight: 700; line-height: 1; flex-shrink: 0; }
        .muscle-icon { width: 18px; height: 18px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; margin: 1px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.24), 0 3px 6px rgba(15,23,42,0.12); }
        .day-icons.count-3 .muscle-icon,
        .day-icons.count-4 .muscle-icon,
        .day-icons.count-5 .muscle-icon,
        .day-icons.count-6 .muscle-icon,
        .day-icons.count-7 .muscle-icon { width: 13px; height: 13px; font-size: 9px; margin: 0; border-radius: 3px; }
        .chest { background: linear-gradient(180deg, #ffb27d 0%, #ff8a4c 100%); }
        .back { background: linear-gradient(180deg, #8da2ff 0%, #5b6cff 100%); }
        .shoulder { background: linear-gradient(180deg, #b287ff 0%, #8a63ff 100%); }
        .leg { background: linear-gradient(180deg, #66d4c1 0%, #2fb59f 100%); }
        .arm { background: linear-gradient(180deg, #7fd3ff 0%, #3aa0ff 100%); }
        .core { background: linear-gradient(180deg, #ffd86f 0%, #ffb340 100%); }
        .cardio { background: linear-gradient(180deg, #ff8f86 0%, #ff5f57 100%); }
        .form-group select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,0.88); color: var(--text); font-size: 16px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.28); z-index: 200; align-items: center; justify-content: center; padding: 5px; }
        .modal.show { display: flex; }
        .modal-content { background: linear-gradient(180deg, rgba(255,255,255,0.97) 0%, rgba(247,248,251,0.9) 40%, rgba(232,236,242,0.82) 100%); -webkit-backdrop-filter: blur(28px) saturate(185%); backdrop-filter: blur(28px) saturate(185%); border: 1px solid rgba(255,255,255,0.8); border-radius: 20px; padding: 12px; width: 100%; max-width: 280px; max-height: 90vh; overflow-y: auto; box-shadow: var(--highlight), var(--shadow-deep), 0 2px 0 rgba(255,255,255,0.9); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .modal-header h2 { font-size: 14px; color: var(--text); }
        .close-btn { background: none; border: none; color: var(--accent); font-size: 16px; cursor: pointer; }
        .muscle-select { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
        .muscle-btn { padding: 8px 6px; border: 1px solid rgba(255,255,255,0.32); border-radius: 10px; color: white; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.26), inset 0 -4px 10px rgba(0,0,0,0.08), 0 8px 16px rgba(15,23,42,0.12); transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease; }
        .muscle-btn:active { transform: translateY(2px) scale(0.97); }
        .muscle-btn.selected { opacity: 0.92; box-shadow: 0 0 0 2px var(--accent), inset 0 1px 0 rgba(255,255,255,0.3), 0 12px 20px rgba(0,113,227,0.18); transform: translateY(-1px); }
        .muscle-btn span { font-size: 16px; }
        .detail-section { background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(247,248,251,0.8) 44%, rgba(232,236,242,0.72) 100%); -webkit-backdrop-filter: blur(24px) saturate(175%); backdrop-filter: blur(24px) saturate(175%); border: 1px solid rgba(255,255,255,0.74); border-radius: 22px; margin: 12px 5px; padding: 15px; box-shadow: var(--highlight), var(--shadow-deep), 0 2px 0 rgba(255,255,255,0.9); position: relative; z-index: 1; }
        .detail-header { font-size: 18px; font-weight: 600; margin-bottom: 15px; color: var(--accent); }
        .exercise-list { display: flex; flex-direction: column; gap: 10px; }
        .record-muscle-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .record-muscle-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 32px; min-height: 56px; border: 1px solid rgba(0,113,227,0.12); border-radius: 16px; background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(237,244,252,0.92) 100%); color: var(--accent-deep); padding: 8px 0; font-size: 11px; font-weight: 700; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.94), 0 5px 10px rgba(0,113,227,0.06); white-space: normal; overflow: hidden; text-overflow: clip; text-align: center; line-height: 1.1; flex: 0 0 auto; }
        .record-muscle-btn.active { border-width: 2px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.56), 0 6px 12px rgba(17,24,39,0.08); }
        .record-muscle-icon { display: block; font-size: 16px; line-height: 1; }
        .record-muscle-label { display: block; max-width: 100%; font-size: 10px; line-height: 1.1; word-break: break-all; }
        .exercise-item { background: linear-gradient(180deg, rgba(255,255,255,0.97) 0%, rgba(247,248,251,0.9) 45%, rgba(233,237,243,0.8) 100%); -webkit-backdrop-filter: blur(18px) saturate(165%); backdrop-filter: blur(18px) saturate(165%); border: 1px solid rgba(255,255,255,0.72); border-radius: 16px; padding: 11px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--highlight), 0 12px 22px rgba(17,24,39,0.08), 0 2px 0 rgba(255,255,255,0.88); }
        .exercise-row1 { display: flex; align-items: center; gap: 6px; min-height: 24px; }
        .exercise-row1 .exercise-name { padding: 0; cursor: default; font-size: 12px; line-height: 1; }
        .exercise-row1 .exercise-name:hover { background: transparent; }
        .group-order-controls { margin-left: auto; display: flex; gap: 4px; }
        .reorder-btn { width: 22px; height: 22px; border: 1px solid rgba(0,113,227,0.12); border-radius: 7px; background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(237,244,252,0.92) 100%); color: var(--accent); font-size: 10px; font-weight: 700; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.94), 0 5px 10px rgba(0,113,227,0.08); }
        .reorder-btn:active { transform: translateY(1px); }
        .reorder-btn:disabled { opacity: 0.35; cursor: default; box-shadow: none; }
        .exercise-row2 { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; font-size: 12px; }
        .exercise-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 4px; }
        .exercise-tab-btn { border: 1px solid rgba(0,113,227,0.12); border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(237,244,252,0.92) 100%); color: var(--accent-deep); padding: 4px 10px; font-size: 10px; font-weight: 600; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.94), 0 5px 10px rgba(0,113,227,0.06); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .exercise-tab-btn.active { background: var(--primary-gradient); color: #fff; border-color: rgba(255,255,255,0.34); box-shadow: inset 0 1px 0 rgba(255,255,255,0.36), 0 8px 14px rgba(0,113,227,0.18); }
        .exercise-action-group { display: flex; flex-direction: column; gap: 48px; }
        .exercise-tab-panel { display: flex; flex-direction: column; gap: 6px; }

        .exercise-icon { width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
        .exercise-icon.chest { background: linear-gradient(180deg, #ffb27d 0%, #ff8a4c 100%); }
        .exercise-icon.back { background: linear-gradient(180deg, #8da2ff 0%, #5b6cff 100%); }
        .exercise-icon.shoulder { background: linear-gradient(180deg, #b287ff 0%, #8a63ff 100%); }
        .exercise-icon.leg { background: linear-gradient(180deg, #66d4c1 0%, #2fb59f 100%); }
        .exercise-icon.arm { background: linear-gradient(180deg, #7fd3ff 0%, #3aa0ff 100%); }
        .exercise-icon.core { background: linear-gradient(180deg, #ffd86f 0%, #ffb340 100%); }
        .exercise-icon.cardio { background: linear-gradient(180deg, #ff8f86 0%, #ff5f57 100%); }
        .exercise-content { flex: 1; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

        .exercise-sets { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 4px; }

        .record-muscle-btn.shoulder.active, .stats-btn.muscle-filter-btn.shoulder.active { background: linear-gradient(180deg, rgba(178,135,255,0.28) 0%, rgba(138,99,255,0.16) 100%); border-color: rgba(138,99,255,0.58); color: #6b44d6; }

        .record-muscle-btn.arm.active, .stats-btn.muscle-filter-btn.arm.active { background: linear-gradient(180deg, rgba(127,211,255,0.28) 0%, rgba(58,160,255,0.16) 100%); border-color: rgba(58,160,255,0.58); color: #1f73c7; }
        .record-muscle-btn.core.active, .stats-btn.muscle-filter-btn.core.active { background: linear-gradient(180deg, rgba(255,216,111,0.3) 0%, rgba(255,179,64,0.16) 100%); border-color: rgba(255,179,64,0.58); color: #b37417; }
        .record-muscle-btn.cardio.active, .stats-btn.muscle-filter-btn.cardio.active { background: linear-gradient(180deg, rgba(255,143,134,0.28) 0%, rgba(255,95,87,0.16) 100%); border-color: rgba(255,95,87,0.58); color: #c9473f; }

        .stats-card-title { font-size: 16px; font-weight: 600; color: var(--accent); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }

        .stats-card-item:last-child { border-bottom: none; }
        .stats-label { color: var(--muted); font-size: 14px; }

        .stats-empty { text-align: center; color: var(--muted); padding: 20px; }
        .stats-summary-actions { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .stats-copy-btn { background: var(--neutral-gradient); border: 1px solid rgba(255,255,255,0.74); border-radius: 12px; padding: 8px 12px; color: #3a3a3c; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: inset 0 1px 0 rgba(255,255,255,0.84), 0 8px 14px rgba(17,24,39,0.06); }
        .stats-copy-btn:active { transform: scale(0.98); }
        .stats-markdown { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; line-height: 1.65; color: var(--text); background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(243,245,249,0.88) 100%); border: 1px solid rgba(255,255,255,0.72); border-radius: 16px; padding: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.92), inset 0 -8px 16px rgba(220,226,234,0.24); }
        .milestone-section { margin-top: 12px; padding-top: 0; }

        .milestone-actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
        .milestone-action-btn { width: 100%; background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(241,244,248,0.9) 100%); border: 1px solid rgba(255,255,255,0.74); border-radius: 999px; padding: 6px 8px; color: #3a3a3c; font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: inset 0 1px 0 rgba(255,255,255,0.82); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .milestone-item:last-child { border-bottom: none; }
        .milestone-meta { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: center; }
        .milestone-date { color: var(--muted); font-size: 13px; white-space: nowrap; flex-shrink: 0; }
        .milestone-value { color: var(--text); font-size: 14px; font-weight: 600; white-space: nowrap; flex-shrink: 0; min-width: 58px; }

<body>
    <div class="header"><h1>💪 健身月历</h1><button class="header-action left" onclick="exportData()">导出</button><button class="header-action right" onclick="document.getElementById('importFile').click()">导入</button><input type="file" id="importFile" accept=".json" onchange="importData(this)"></div>
    <div class="nav">
        <button id="prevMonth">◀</button>
        <span class="month-year" id="monthYear"></span>
        <button id="nextMonth">▶</button>
    </div>
    <div class="calendar" id="calendar"></div>
    <div class="detail-section" id="detailSection">
        <div class="tab-container">
            <button class="tab-btn active" id="tabRecord" onclick="switchTab('record')">记录</button>
            <button class="tab-btn" id="tabVolume" onclick="switchTab('volume')">容量</button>
            <button class="tab-btn" id="tabStats" onclick="switchTab('stats')">统计</button>
            <button class="add-btn-small" onclick="openM()">+ 添加</button>
        </div>
        <div class="tab-content active" id="recordContent">
            <div class="exercise-list" id="exerciseList"><div class="no-data">点击日期添加/查看训练记录</div></div>
        </div>
        <div class="tab-content" id="volumeContent">
            <div class="chart-container" id="chartContainer"></div>
        </div>
        <div class="tab-content" id="statsContent">
            <div class="stats-container" id="statsContainer"></div>
        </div>
    </div>
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>添加训练</h2>
                <button class="close-btn" id="closeModal">×</button>
            </div>
            <div class="muscle-select" id="muscleSelect">
                <button class="muscle-btn chest" data-muscle="chest"><span>❤️</span>胸肌</button>
                <button class="muscle-btn back" data-muscle="back"><span>🛡️</span>背部</button>
                <button class="muscle-btn shoulder" data-muscle="shoulder"><span>🏋️</span>肩部</button>
                <button class="muscle-btn leg" data-muscle="leg"><span>🦵</span>腿部</button>
                <button class="muscle-btn arm" data-muscle="arm"><span>💪</span>手臂</button>
                <button class="muscle-btn cardio" data-muscle="cardio"><span>🏃</span>有氧</button>
            </div>
            <div class="add-form" id="addForm">
                <div class="form-group"><label>动作名称</label><input type="text" id="exerciseName" list="exerciseNameOptions" placeholder="可选择或手动输入"><datalist id="exerciseNameOptions"></datalist></div>
                <div class="form-group"><label>组数</label><input type="number" id="exerciseSets" placeholder="如：4" min="1"></div>
                <div class="form-group"><label>次数/组</label><input type="text" id="exerciseReps" placeholder="如：12 或 8-12"></div>
                <div class="form-group"><label>重量(kg)</label><input type="number" id="exerciseWeight" placeholder="如：60" step="0.5"></div>
                <button class="add-exercise-btn" id="addExercise">添加动作</button>
            </div>
        </div>
    </div>
    <script>
var data = JSON.parse(localStorage.getItem('fd')||'{}');
var curDate = new Date(), selDate = null, selMuscle = null, editIdx = -1;
var recordActionTabs = {};
var recordMuscleTabs = {};
var icons = {chest:'❤️',back:'🛡️',shoulder:'🏋️',leg:'🦵',arm:'💪',core:'🎯',cardio:'🏃'};
var exerciseNames = {
    chest:['卧推','上斜卧推','下斜卧推','哑铃飞鸟','器械夹胸','俯卧撑'],
    back:['引体向上','高位下拉','杠铃划船','哑铃划船','坐姿划船','硬拉'],
    shoulder:['哑铃推举','杠铃推举','侧平举','前平举','俯身飞鸟','面拉'],
    leg:['深蹲','腿举','腿弯举','腿屈伸','弓步蹲','小腿提踵'],
    arm:['哑铃弯举','杠铃弯举','锤式弯举','绳索下压','哑铃臂屈伸','集中弯举'],
    core:['卷腹','仰卧起坐','平板支撑','俄罗斯转体','悬垂举腿','健腹轮'],
    cardio:['跑步','椭圆机','动感单车','跳绳','游泳','爬楼梯','划船机']
};
function save(){localStorage.setItem('fd',JSON.stringify(data));}
function pad(n){return String(n).padStart(2,'0');}
function fillExerciseNameOptions(m){
    var options=document.getElementById('exerciseNameOptions');
    options.innerHTML='';
    var names=exerciseNames[m]||[];
    for(var i=0;i<names.length;i++){
        options.innerHTML+='<option value="'+names[i]+'"></option>';
    }
}
function getTodayKey(){
    var today=new Date();
    return today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
}
function scrollToDateCell(dk){
    var cell=document.querySelector('.day[data-date="'+dk+'"]');
    if(cell)cell.scrollIntoView({behavior:'smooth',block:'center'});
}
function scrollToPageBottom(){
    window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'});
}
function render(){
    var c=document.getElementById('calendar');c.innerHTML='';
    ['日','一','二','三','四','五','六'].forEach(function(d){c.innerHTML+='<div class="weekday">'+d+'</div>';});
    var y=curDate.getFullYear(),m=curDate.getMonth();
    var fd=new Date(y,m,1).getDay(),dm=new Date(y,m+1,0).getDate(),td=new Date();
    for(var i=0;i<fd;i++)c.innerHTML+='<div class="day empty"></div>';
    for(var d=1;d<=dm;d++){
        var dk=y+'-'+pad(m+1)+'-'+pad(d);
        var cls='day';
        if(td.getFullYear()===y&&td.getMonth()===m&&td.getDate()===d)cls+=' today';
        if(selDate===dk)cls+=' selected';
        var ic='',iconCount=0;
        if(data[dk]){
            var ms=new Set(data[dk].map(function(e){return e.muscle;}));
            iconCount=ms.size;
            ms.forEach(function(mu){ic+='<div class="muscle-icon '+mu+'">'+(icons[mu]||'💪')+'</div>';});
        }
        c.innerHTML+='<div class="'+cls+'" data-date="'+dk+'" onclick="sel(\''+dk+'\')" title="'+(m+1)+'月'+d+'日"><div class="day-number">'+d+'</div><div class="day-icons count-'+iconCount+'">'+ic+'</div></div>';
    }
    document.getElementById('monthYear').textContent=y+'年 '+(m+1)+'月';
}
function sel(dk){selDate=dk;render();switchTab('record');showDetail(dk);}
function calcVolume(ex){
    var vol=0;
    for(var i=0;i<ex.length;i++){
        var e=ex[i];
        var reps=parseInt(e.reps)||0;
        var weight=e.weight||0;
        vol+=e.sets*reps*weight;
    }
    return vol;
}
function calcMaxWeight(ex){
    var maxWeight=0;
    for(var i=0;i<ex.length;i++){
        var weight=ex[i].weight||0;
        if(weight>maxWeight)maxWeight=weight;
    }
    return maxWeight;
}
function getExerciseGroups(ex){
    var groups=[];
    var groupMap={};
    for(var i=ex.length-1;i>=0;i--){
        var e=ex[i];
        if(!groupMap[e.muscle]){
            groupMap[e.muscle]={muscle:e.muscle,actions:[],actionMap:{}};
            groups.push(groupMap[e.muscle]);
        }
        var muscleGroup=groupMap[e.muscle];
        if(!muscleGroup.actionMap[e.name]){
            muscleGroup.actionMap[e.name]={name:e.name,items:[]};
            muscleGroup.actions.push(muscleGroup.actionMap[e.name]);
        }
        muscleGroup.actionMap[e.name].items.push({index:i,exercise:e});
    }
    return groups;
}
function reorderExercisesByGroups(groups){
    var reordered=[];
    for(var gi=groups.length-1;gi>=0;gi--){
        var actions=groups[gi].actions;
        for(var ai=actions.length-1;ai>=0;ai--){
            var items=actions[ai].items;
            for(var ii=items.length-1;ii>=0;ii--){
                reordered.push(items[ii].exercise);
            }
        }
    }
    return reordered;
}
function getRecordActionTabKey(dk,muscle){
    return dk+'__'+muscle;
}
function getRecordMuscleTabKey(dk){
    return dk;
}
function setRecordMuscleTab(dk,muscle){
    recordMuscleTabs[getRecordMuscleTabKey(dk)]=muscle;
    showDetail(dk);
}
function setRecordActionTab(dk,muscle,actionName){
    recordActionTabs[getRecordActionTabKey(dk,muscle)]=actionName;
    showDetail(dk);
}
function showDetail(dk){
    var lst=document.getElementById('exerciseList');
    var ex=data[dk]||[];
    if(!ex.length){lst.innerHTML='<div class="no-data">暂无训练记录，点击上方添加</div>';return;}
    var htm='';
    var groups=getExerciseGroups(ex);
    var activeMuscle=recordMuscleTabs[getRecordMuscleTabKey(dk)];
    if(!activeMuscle||!groups.some(function(group){return group.muscle===activeMuscle;})){
        activeMuscle=groups[0].muscle;
        recordMuscleTabs[getRecordMuscleTabKey(dk)]=activeMuscle;
    }
    htm+='<div class="record-muscle-tabs">';
    for(var gi=0;gi<groups.length;gi++){
        var muscleGroup=groups[gi];
        htm+='<button class="record-muscle-btn '+muscleGroup.muscle+(muscleGroup.muscle===activeMuscle?' active':'')+'" onclick="setRecordMuscleTab(\''+dk+'\',\''+muscleGroup.muscle+'\')"><span class="record-muscle-icon">'+(icons[muscleGroup.muscle]||'💪')+'</span><span class="record-muscle-label">'+(muscleNames[muscleGroup.muscle]||muscleGroup.muscle)+'</span></button>';
    }
    htm+='</div>';
    var groupIndex=0;
    for(var gsi=0;gsi<groups.length;gsi++){
        if(groups[gsi].muscle===activeMuscle){groupIndex=gsi;break;}
    }
    var group=groups[groupIndex];
    var firstAction=group.actions[0];
    var e=firstAction.items[0].exercise;
    var tabKey=getRecordActionTabKey(dk,e.muscle);
    var activeActionName=recordActionTabs[tabKey];
    if(!activeActionName||!group.actionMap[activeActionName]){
        activeActionName=firstAction.name;
        recordActionTabs[tabKey]=activeActionName;
    }
    htm+='<div class="exercise-item">'+
        '<div class="exercise-tabs">';
    for(var ai=0;ai<group.actions.length;ai++){
        var action=group.actions[ai];
        htm+='<button class="exercise-tab-btn'+(action.name===activeActionName?' active':'')+'" onclick="setRecordActionTab(\''+dk+'\',\''+e.muscle+'\',\''+action.name+'\')">'+action.name+'</button>';
    }
    htm+='</div>';
    var activeAction=group.actionMap[activeActionName];
    htm+='<div class="exercise-action-group">'+
        '<div class="exercise-tab-panel">';
    for(var ii=0;ii<activeAction.items.length;ii++){
        var item=activeAction.items[ii];
        htm+=
        '<div class="exercise-subitem">'+
            '<div class="param-group"><button class="adjust-btn" onclick="adjSets(\''+dk+'\','+item.index+',-1)">-</button><span class="adjust-value">'+item.exercise.sets+'</span><button class="adjust-btn" onclick="adjSets(\''+dk+'\','+item.index+',1)">+</button><span class="param-label">组</span></div>'+
            '<div class="param-group"><button class="adjust-btn" onclick="adjReps(\''+dk+'\','+item.index+',-1)">-</button><span class="adjust-value">'+item.exercise.reps+'</span><button class="adjust-btn" onclick="adjReps(\''+dk+'\','+item.index+',1)">+</button><span class="param-label">次</span></div>'+
            '<div class="param-group"><input type="number" class="metric-input" value="'+(item.exercise.weight!=null?item.exercise.weight:'')+'" step="0.5" min="0" onchange="setWeightValue(\''+dk+'\','+item.index+',this.value)" /><span class="param-label">kg</span></div>'+
            '<button class="delete-btn" onclick="del(\''+dk+'\','+item.index+')" title="删除" aria-label="删除">-</button>'+
            '<button class="copy-btn" onclick="dup(\''+dk+'\','+item.index+')" title="复制" aria-label="复制">+</button>'+
        '</div>';
    }
    htm+='</div></div></div>';
    lst.innerHTML=htm;
}
function moveExerciseGroup(dk,groupIdx,delta){
    var ex=data[dk]||[];
    if(!ex.length)return;
    var groups=getExerciseGroups(ex);
    var targetIdx=groupIdx+delta;
    if(targetIdx<0||targetIdx>=groups.length)return;
    var movedGroup=groups.splice(groupIdx,1)[0];
    groups.splice(targetIdx,0,movedGroup);
    data[dk]=reorderExercisesByGroups(groups);
    save();
    render();
    showDetail(dk);
}
function getTopExerciseMuscle(dk){
    var ex=data[dk]||[];
    if(!ex.length)return null;
    return ex[ex.length-1].muscle||null;
}
function getTopExerciseInfo(dk){
    var ex=data[dk]||[];
    if(!ex.length)return null;
    var topExercise=ex[ex.length-1];
    return {muscle:topExercise.muscle||null,name:topExercise.name||''};
}
function getTopSelectedRecordInfo(dk){
    var ex=data[dk]||[];
    if(!ex.length)return null;
    var groups=getExerciseGroups(ex);
    if(!groups.length)return null;
    var topGroup=groups[0];
    var activeMuscle=recordMuscleTabs[getRecordMuscleTabKey(dk)];
    if(activeMuscle){
        for(var gi=0;gi<groups.length;gi++){
            if(groups[gi].muscle===activeMuscle){
                topGroup=groups[gi];
                break;
            }
        }
    }
    var firstAction=topGroup.actions[0];
    if(!firstAction)return null;
    var tabKey=getRecordActionTabKey(dk,topGroup.muscle);
    var activeActionName=recordActionTabs[tabKey];
    if(!activeActionName||!topGroup.actionMap[activeActionName]){
        activeActionName=firstAction.name;
    }
    return {muscle:topGroup.muscle||null,name:activeActionName||''};
}
function editName(dk,i,el){
    var curName=data[dk][i].name;
    var input=document.createElement('input');
    input.type='text';
    input.className='exercise-name-input';
    input.value=curName;
    input.onblur=function(){
        var newName=this.value.trim();
        if(newName&&newName!==curName){
            data[dk][i].name=newName;
            save();
        }
        showDetail(dk);
    };
    input.onkeydown=function(e){
        if(e.key==='Enter')this.blur();
        if(e.key==='Escape'){this.value=curName;this.blur();}
    };
    el.innerHTML='';
    el.appendChild(input);
    input.focus();
    input.select();
}
function editNameGroup(dk,i,el){
    var curName=data[dk][i].name;
    var curMuscle=data[dk][i].muscle;
    var input=document.createElement('input');
    input.type='text';
    input.className='exercise-name-input';
    input.value=curName;
    input.onblur=function(){
        var newName=this.value.trim();
        if(newName&&newName!==curName){
            for(var idx=0;idx<data[dk].length;idx++){
                if(data[dk][idx].name===curName&&data[dk][idx].muscle===curMuscle){
                    data[dk][idx].name=newName;
                }
            }
            save();
        }
        showDetail(dk);
    };
    input.onkeydown=function(e){
        if(e.key==='Enter')this.blur();
        if(e.key==='Escape'){this.value=curName;this.blur();}
    };
    el.innerHTML='';
    el.appendChild(input);
    input.focus();
    input.select();
}
function setWeightValue(dk,i,val){
    var nextValue=val===''?null:parseFloat(val);
    if(nextValue!==null&&isNaN(nextValue))return;
    data[dk][i].weight=nextValue===null?null:Math.max(0,nextValue);
    save();
    showDetail(dk);
}
function adjWeight(dk,i,d){data[dk][i].weight=Math.max(0,(data[dk][i].weight||0)+d*2.5);save();showDetail(dk);}
function dup(dk,i){
    if(!data[dk]||!data[dk][i])return;
    var source=data[dk][i];
    data[dk].push({muscle:source.muscle,name:source.name,sets:source.sets,reps:source.reps,weight:source.weight});
    recordMuscleTabs[getRecordMuscleTabKey(dk)]=source.muscle;
    recordActionTabs[getRecordActionTabKey(dk,source.muscle)]=source.name;
    save();
    render();
    showDetail(dk);
}
function del(dk,i){data[dk].splice(i,1);if(!data[dk].length)delete data[dk];save();render();showDetail(dk);}
function adjSets(dk,i,d){data[dk][i].sets=Math.max(1,data[dk][i].sets+d);save();showDetail(dk);}
function adjReps(dk,i,d){var r=parseInt(data[dk][i].reps)||1;r=Math.max(1,r+d);data[dk][i].reps=String(r);save();showDetail(dk);}

function showVolumeChart(){
    var container=document.getElementById('chartContainer');
    var y=curDate.getFullYear(),m=curDate.getMonth();
    var muscles=['chest','back','shoulder','leg','arm'];
    var muscleDateVols={chest:{},back:{},shoulder:{},leg:{},arm:{}};
    for(var dk in data){
        var parts=dk.split('-');
        if(parseInt(parts[0])!==y||parseInt(parts[1])!==m+1)continue;
        var ex=data[dk];
        for(var i=0;i<ex.length;i++){
            var e=ex[i];
            if(!muscleDateVols[e.muscle])continue;
            var reps=parseInt(e.reps)||0;
            var weight=e.weight||0;
            var dayVolume=e.sets*reps*weight;
            muscleDateVols[e.muscle][dk]=(muscleDateVols[e.muscle][dk]||0)+dayVolume;
        }
    }

    var allDates={};
    for(var mi=0;mi<muscles.length;mi++){
        var muscleKey=muscles[mi];
        for(var dk2 in muscleDateVols[muscleKey]){
            if(muscleDateVols[muscleKey][dk2]>0)allDates[dk2]=true;
        }
    }
    var allDataDates=Object.keys(allDates).sort();
    if(!allDataDates.length){
        container.innerHTML='<div class="no-data">本月暂无训练数据</div>';
        return;
    }

    var htm='<div class="stats-buttons" style="margin-bottom:10px;">';
    for(var bi=0;bi<muscles.length;bi++){
        var muBtn=muscles[bi];
        var hasData=false;
        for(var dateKey in muscleDateVols[muBtn]){
            if(muscleDateVols[muBtn][dateKey]>0){hasData=true;break;}
        }
        if(hasData){
            var btnActive=(volumeMuscle===muBtn)?' active':'';
            htm+='<button class="stats-btn muscle-filter-btn '+muBtn+btnActive+'" onclick="setVolumeMuscle(\''+muBtn+'\')"><span class="stats-btn-icon">'+icons[muBtn]+'</span><span class="stats-btn-label">'+muscleNames[muBtn]+'</span></button>';
        }
    }
    var allActive=(volumeMuscle==='all')?' active':'';
    htm+='<button class="stats-btn'+allActive+'" onclick="setVolumeMuscle(\'all\')"><span class="stats-btn-icon">📊</span><span class="stats-btn-label">全部</span></button>';
    htm+='</div>';
    if(!volumeMuscle){
        container.innerHTML=htm;
        return;
    }

    var selectedMuscle=volumeMuscle;
    var dates=selectedMuscle==='all'
        ? allDataDates
        : Object.keys(muscleDateVols[selectedMuscle]||{}).filter(function(dateKey){
            return (muscleDateVols[selectedMuscle][dateKey]||0)>0;
        }).sort();
    if(!dates.length){
        container.innerHTML=htm+'<div class="no-data">本月暂无训练数据</div>';
        return;
    }
    var padding={top:20,right:20,bottom:30,left:40};
    var width=320,height=200;
    var chartW=width-padding.left-padding.right;
    var chartH=height-padding.top-padding.bottom;
    var seriesMap={};
    var displayedMaxVol=0;
    var displayedMinVol=Infinity;

    if(selectedMuscle==='all'){
        for(var ai=0;ai<muscles.length;ai++){
            var allMuscle=muscles[ai];
            var allPts=[];
            for(var di=0;di<dates.length;di++){
                var allDate=dates[di];
                var allVol=muscleDateVols[allMuscle][allDate]||0;
                if(allVol>0){
                    allPts.push({dk:allDate,vol:allVol});
                    if(allVol>displayedMaxVol)displayedMaxVol=allVol;
                    if(allVol<displayedMinVol)displayedMinVol=allVol;
                }
            }
            if(allPts.length)seriesMap[allMuscle]=allPts;
        }
    }else{
        var singlePts=[];
        for(var si=0;si<dates.length;si++){
            var singleDate=dates[si];
            var singleVol=muscleDateVols[selectedMuscle][singleDate]||0;
            if(singleVol>0){
                singlePts.push({dk:singleDate,vol:singleVol});
                if(singleVol>displayedMaxVol)displayedMaxVol=singleVol;
                if(singleVol<displayedMinVol)displayedMinVol=singleVol;
            }
        }
        if(singlePts.length)seriesMap[selectedMuscle]=singlePts;
    }

    if(displayedMaxVol===0){
        container.innerHTML=htm+'<div class="no-data">本月暂无训练数据</div>';
        return;
    }

    var axisMax=Math.ceil(displayedMaxVol/100)*100||100;
    htm+='<div class="line-chart"><svg class="line-chart-svg" viewBox="0 0 '+width+' '+height+'">';
    for(var gi=0;gi<=4;gi++){
        var gridY=padding.top+chartH*gi/4;
        htm+='<line class="chart-grid" x1="'+padding.left+'" y1="'+gridY+'" x2="'+(width-padding.right)+'" y2="'+gridY+'"/>';
        var axisVal=Math.round(axisMax*(4-gi)/4);
        htm+='<text class="chart-axis" x="'+(padding.left-5)+'" y="'+(gridY+4)+'" text-anchor="end">'+axisVal+'</text>';
    }
    for(var xi=0;xi<dates.length;xi++){
        var xLabel=padding.left+chartW*xi/(dates.length-1||1);
        var day=parseInt(dates[xi].split('-')[2]);
        htm+='<text class="chart-axis" x="'+xLabel+'" y="'+(height-10)+'" text-anchor="middle">'+day+'日</text>';
    }
    if(displayedMinVol!==Infinity){
        var maxGuideY=padding.top+chartH*(1-displayedMaxVol/axisMax);
        var minGuideY=padding.top+chartH*(1-displayedMinVol/axisMax);
        htm+='<line class="chart-guide-line chart-guide-max" x1="'+padding.left+'" y1="'+maxGuideY+'" x2="'+(width-padding.right)+'" y2="'+maxGuideY+'"/>';
        htm+='<text class="chart-guide-label chart-guide-label-max" x="'+(width-padding.right-2)+'" y="'+(maxGuideY-4)+'" text-anchor="end">MAX '+displayedMaxVol+'</text>';
        htm+='<line class="chart-guide-line chart-guide-min" x1="'+padding.left+'" y1="'+minGuideY+'" x2="'+(width-padding.right)+'" y2="'+minGuideY+'"/>';
        htm+='<text class="chart-guide-label chart-guide-label-min" x="'+(width-padding.right-2)+'" y="'+(minGuideY-4)+'" text-anchor="end">MIN '+displayedMinVol+'</text>';
    }

    for(var key in seriesMap){
        var pts=seriesMap[key];
        if(!pts.length)continue;
        if(pts.length>1){
            var pathD='';
            for(var pi=0;pi<pts.length;pi++){
                var idx=dates.indexOf(pts[pi].dk);
                var px=padding.left+chartW*idx/(dates.length-1||1);
                var py=padding.top+chartH*(1-pts[pi].vol/axisMax);
                pathD+=(pi===0?'M':' L')+px+' '+py;
            }
            htm+='<path class="chart-line" stroke="'+muscleColors[key]+'" d="'+pathD+'"'+(selectedMuscle==='all'?' data-muscle="'+key+'" style="opacity:1"':'')+'/>';
        }
        for(var pj=0;pj<pts.length;pj++){
            var pointIdx=dates.indexOf(pts[pj].dk);
            var pointX=padding.left+chartW*pointIdx/(dates.length-1||1);
            var pointY=padding.top+chartH*(1-pts[pj].vol/axisMax);
            var pointR=selectedMuscle==='all'?3:4;
            var pointTitle=(selectedMuscle==='all'?icons[key]+' '+muscleNames[key]+' · ':pts[pj].dk.split('-')[2]+'日: ')+pts[pj].vol+'kg';
            htm+='<circle class="chart-point" cx="'+pointX+'" cy="'+pointY+'" r="'+pointR+'" fill="'+muscleColors[key]+'" data-muscle="'+key+'" data-date="'+pts[pj].dk+'" data-vol="'+pts[pj].vol+'"><title>'+pointTitle+'</title></circle>';
        }
    }
    htm+='</svg></div>';
    container.innerHTML=htm;
    bindChartPointTooltips();
}
function hideChartTooltip(){
    var tooltip=document.querySelector('#chartContainer .chart-tooltip');
    if(tooltip)tooltip.remove();
}
function bindChartPointTooltips(){
    var chart=document.querySelector('#chartContainer .line-chart');
    if(!chart)return;
    chart.onclick=function(e){
        if(!e.target.classList.contains('chart-point'))hideChartTooltip();
    };
    chart.querySelectorAll('.chart-point').forEach(function(point){
        point.onclick=function(e){
            e.stopPropagation();
            hideChartTooltip();
            var tooltip=document.createElement('div');
            var mu=this.dataset.muscle;
            var date=this.dataset.date||'';
            var vol=this.dataset.vol||'0';
            tooltip.className='chart-tooltip';
            tooltip.textContent=(mu&&muscleNames[mu]?icons[mu]+' '+muscleNames[mu]+' · ':'')+date+' · '+vol+'kg';
            chart.appendChild(tooltip);
            var chartRect=chart.getBoundingClientRect();
            var pointRect=this.getBoundingClientRect();
            var left=pointRect.left-chartRect.left-tooltip.offsetWidth/2+pointRect.width/2;
            var top=pointRect.top-chartRect.top-tooltip.offsetHeight-8;
            var maxLeft=chart.clientWidth-tooltip.offsetWidth;
            tooltip.style.left=Math.max(0,Math.min(left,maxLeft))+'px';
            tooltip.style.top=Math.max(0,top)+'px';
        };
    });
}

function escapeHtml(str){
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function calcMuscleStats(mu){
    var maxWeight=0,maxRecord=null,maxDailyVol=0,maxDailyDate='';
    var milestones=[];
    var exerciseMilestones={};
    var exerciseMaxWeights={};
    var dateKeys=Object.keys(data).sort();
    for(var di=0;di<dateKeys.length;di++){
        var dk=dateKeys[di];
        var exs=data[dk];
        var dayVol=0;
        for(var i=0;i<exs.length;i++){
            var e=exs[i];
            if(e.muscle!==mu)continue;
            var reps=parseInt(e.reps)||0;
            var w=e.weight||0;
            if(!exerciseMilestones[e.name])exerciseMilestones[e.name]=[];
            if(w>maxWeight){
                maxWeight=w;
                maxRecord={name:e.name,sets:e.sets,reps:e.reps,weight:w,date:dk};
                milestones.push({weight:w,date:dk});
            }
            if(w>(exerciseMaxWeights[e.name]||0)){
                exerciseMaxWeights[e.name]=w;
                exerciseMilestones[e.name].push({date:dk,weight:w,sets:e.sets,reps:e.reps});
            }
            var mvol=e.sets*reps*w;
            dayVol+=mvol;
        }
        if(dayVol>maxDailyVol){
            maxDailyVol=dayVol;
            maxDailyDate=dk;
        }
    }
    return {maxWeight:maxWeight,maxRecord:maxRecord,maxDailyVol:maxDailyVol,maxDailyDate:maxDailyDate,milestones:milestones,exerciseMilestones:exerciseMilestones};
}

function isLeapYear(y){
    return (y%4===0&&y%100!==0)||y%400===0;
}
function getYearDays(y){
    return isLeapYear(y)?366:365;
}
function generateSummaryMarkdown(){
    var dateKeys=Object.keys(data).sort();
    if(!dateKeys.length)return '# 健身数据总结\n\n暂无训练数据。';
    var allMuscles=['chest','back','shoulder','leg','arm','cardio'];
    var summaryByMuscle={};
    var exerciseSummary={};
    var monthSummary={};
    var dailySummary={};
    var totalEntries=0,totalSets=0,totalVolume=0,totalWeightEntries=0,totalWeight=0;
    var maxWeightRecord=null;
    for(var ai=0;ai<allMuscles.length;ai++){
        summaryByMuscle[allMuscles[ai]]={days:{},entries:0,maxWeight:0,totalSets:0,totalVolume:0};
    }
    for(var di=0;di<dateKeys.length;di++){
        var dk=dateKeys[di];
        var exs=data[dk]||[];
        var monthKey=dk.slice(0,7);
        if(!monthSummary[monthKey])monthSummary[monthKey]={days:{},entries:0,totalSets:0,totalVolume:0,maxWeight:0};
        if(!dailySummary[dk])dailySummary[dk]={entries:0,totalSets:0,totalVolume:0,muscles:{},names:[]};
        for(var i=0;i<exs.length;i++){
            var e=exs[i];
            var sets=parseInt(e.sets)||0;
            var reps=parseInt(e.reps)||0;
            var weight=e.weight||0;
            var volume=sets*reps*weight;
            totalEntries++;
            totalSets+=sets;
            totalVolume+=volume;
            if(weight>0){totalWeightEntries++;totalWeight+=weight;}
            if(!summaryByMuscle[e.muscle])summaryByMuscle[e.muscle]={days:{},entries:0,maxWeight:0,totalSets:0,totalVolume:0};
            summaryByMuscle[e.muscle].days[dk]=true;
            summaryByMuscle[e.muscle].entries++;
            summaryByMuscle[e.muscle].totalSets+=sets;
            summaryByMuscle[e.muscle].totalVolume+=volume;
            if(weight>summaryByMuscle[e.muscle].maxWeight)summaryByMuscle[e.muscle].maxWeight=weight;
            if(!exerciseSummary[e.name])exerciseSummary[e.name]={muscle:e.muscle,count:0,maxWeight:0,lastDate:dk,totalSets:0,totalVolume:0};
            exerciseSummary[e.name].count++;
            exerciseSummary[e.name].lastDate=dk;
            exerciseSummary[e.name].totalSets+=sets;
            exerciseSummary[e.name].totalVolume+=volume;
            if(weight>exerciseSummary[e.name].maxWeight)exerciseSummary[e.name].maxWeight=weight;
            monthSummary[monthKey].days[dk]=true;
            monthSummary[monthKey].entries++;
            monthSummary[monthKey].totalSets+=sets;
            monthSummary[monthKey].totalVolume+=volume;
            if(weight>monthSummary[monthKey].maxWeight)monthSummary[monthKey].maxWeight=weight;
            dailySummary[dk].entries++;
            dailySummary[dk].totalSets+=sets;
            dailySummary[dk].totalVolume+=volume;
            dailySummary[dk].muscles[e.muscle]=true;
            dailySummary[dk].names.push(e.name);
            if(weight>0&&(!maxWeightRecord||weight>maxWeightRecord.weight)){
                maxWeightRecord={name:e.name,muscle:e.muscle,weight:weight,date:dk};
            }
        }
    }
    var firstDate=new Date(dateKeys[0]);
    var lastDate=new Date(dateKeys[dateKeys.length-1]);
    var spanDays=Math.max(1,Math.round((lastDate-firstDate)/86400000)+1);
    var avgEntriesPerDay=(totalEntries/dateKeys.length).toFixed(1);
    var avgVolumePerDay=Math.round(totalVolume/dateKeys.length);
    var avgWeight=totalWeightEntries?Math.round(totalWeight/totalWeightEntries*10)/10:0;
    var longestStreak=0,currentStreak=0,streak=0,previousTime=null;
    var todayKey=curDate.getFullYear()+'-'+pad(curDate.getMonth()+1)+'-'+pad(curDate.getDate());
    for(var si=0;si<dateKeys.length;si++){
        var currentTime=new Date(dateKeys[si]).getTime();
        if(previousTime!==null&&currentTime-previousTime===86400000){
            streak++;
        }else{
            streak=1;
        }
        if(streak>longestStreak)longestStreak=streak;
        previousTime=currentTime;
    }
    currentStreak=0;
    var cursor=new Date(todayKey+'T00:00:00');
    while(true){
        var key=cursor.getFullYear()+'-'+pad(cursor.getMonth()+1)+'-'+pad(cursor.getDate());
        if(!data[key])break;
        currentStreak++;
        cursor.setDate(cursor.getDate()-1);
    }
    var monthKeys=Object.keys(monthSummary).sort();
    var currentMonthKey=curDate.getFullYear()+'-'+pad(curDate.getMonth()+1);
    var currentMonthDays=monthSummary[currentMonthKey]?Object.keys(monthSummary[currentMonthKey].days).length:0;
    var currentMonthEntries=monthSummary[currentMonthKey]?monthSummary[currentMonthKey].entries:0;
    var currentMonthVolume=monthSummary[currentMonthKey]?Math.round(monthSummary[currentMonthKey].totalVolume):0;
    var currentMonthAttendance=Math.round(currentMonthDays/Math.max(1,getMonthDays(curDate.getFullYear(),curDate.getMonth()))*100);
    var lines=[];
    lines.push('# 健身数据总结');
    lines.push('');
    lines.push('统计区间：'+dateKeys[0]+' ~ '+dateKeys[dateKeys.length-1]+'（跨度 '+spanDays+' 天）');
    lines.push('');
    for(var mi=0;mi<allMuscles.length;mi++){
        var mu=allMuscles[mi];
        var item=summaryByMuscle[mu];
        if(!item||!item.entries)continue;
        var muscleExerciseNames=Object.keys(exerciseSummary).filter(function(name){
            return exerciseSummary[name].muscle===mu;
        });
        var muscleTopPr=muscleExerciseNames.slice().sort(function(a,b){
            if(exerciseSummary[b].maxWeight!==exerciseSummary[a].maxWeight)return exerciseSummary[b].maxWeight-exerciseSummary[a].maxWeight;
            return exerciseSummary[b].count-exerciseSummary[a].count;
        }).slice(0,3);
        var muscleTopFreq=muscleExerciseNames.slice().sort(function(a,b){
            if(exerciseSummary[b].count!==exerciseSummary[a].count)return exerciseSummary[b].count-exerciseSummary[a].count;
            return exerciseSummary[b].totalVolume-exerciseSummary[a].totalVolume;
        }).slice(0,3);
        var muscleRecentDays=dateKeys.filter(function(dk){
            var exs=data[dk]||[];
            for(var i=0;i<exs.length;i++){
                if(exs[i].muscle===mu)return true;
            }
            return false;
        }).slice(-5).reverse();
        var muscleBestDay='暂无';
        var muscleBestDayVolume=0;
        for(var mdi=0;mdi<muscleRecentDays.length;mdi++){
            var dayKey=muscleRecentDays[mdi];
            var exs=data[dayKey]||[];
            var dayVol=0;
            for(var exi=0;exi<exs.length;exi++){
                if(exs[exi].muscle!==mu)continue;
                dayVol+=(parseInt(exs[exi].sets)||0)*(parseInt(exs[exi].reps)||0)*(exs[exi].weight||0);
            }
            if(dayVol>muscleBestDayVolume){
                muscleBestDayVolume=dayVol;
                muscleBestDay=dayKey;
            }
        }
        lines.push('## '+(icons[mu]||'💪')+' '+(muscleNames[mu]||mu));
        lines.push('');
        lines.push('- 训练天数：'+Object.keys(item.days).length+' 天');
        lines.push('- 动作记录：'+item.entries+' 条');
        lines.push('- 累计组数：'+item.totalSets+' 组');
        lines.push('- 累计容量：'+Math.round(item.totalVolume)+' kg');
        lines.push('- 最大重量：'+item.maxWeight+' kg');
        lines.push('- 涉及动作：'+muscleExerciseNames.length+' 个');
        lines.push('- 最强单日：'+muscleBestDay+' · '+Math.round(muscleBestDayVolume)+' kg');
        lines.push('');
        lines.push('### PR 动作');
        lines.push('');
        if(muscleTopPr.length){
            for(var pi=0;pi<muscleTopPr.length;pi++){
                var prName=muscleTopPr[pi];
                var prItem=exerciseSummary[prName];
                lines.push((pi+1)+'. '+prName+' - '+prItem.maxWeight+' kg，'+prItem.count+' 次，最近：'+prItem.lastDate);
            }
        }else{
            lines.push('- 暂无 PR 动作数据');
        }
        lines.push('');
        lines.push('### 高频动作');
        lines.push('');
        if(muscleTopFreq.length){
            for(var fi=0;fi<muscleTopFreq.length;fi++){
                var freqName=muscleTopFreq[fi];
                var freqItem=exerciseSummary[freqName];
                lines.push((fi+1)+'. '+freqName+' - '+freqItem.count+' 次，'+freqItem.totalSets+' 组，'+Math.round(freqItem.totalVolume)+' kg');
            }
        }else{
            lines.push('- 暂无高频动作数据');
        }
        lines.push('');
        lines.push('### 最近训练');
        lines.push('');
        if(muscleRecentDays.length){
            for(var ri=0;ri<muscleRecentDays.length;ri++){
                var recentDayKey=muscleRecentDays[ri];
                var recentExs=(data[recentDayKey]||[]).filter(function(e){return e.muscle===mu;});
                var recentNames=recentExs.map(function(e){return e.name;});
                var recentSets=0;
                var recentVol=0;
                for(var rj=0;rj<recentExs.length;rj++){
                    recentSets+=(parseInt(recentExs[rj].sets)||0);
                    recentVol+=(parseInt(recentExs[rj].sets)||0)*(parseInt(recentExs[rj].reps)||0)*(recentExs[rj].weight||0);
                }
                lines.push('- '+recentDayKey+'：'+recentNames.join('、')+' | '+recentExs.length+' 条动作 | '+recentSets+' 组 | '+Math.round(recentVol)+' kg');
            }
        }else{
            lines.push('- 暂无最近训练数据');
        }
        lines.push('');
    }
    return lines.join('\n');
}
function copySummaryMarkdown(){
    var text=generateSummaryMarkdown();
    if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){
            alert('Markdown 已复制');
        }).catch(function(){
            var textarea=document.createElement('textarea');
            textarea.value=text;
            textarea.style.position='fixed';
            textarea.style.opacity='0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try{document.execCommand('copy');alert('Markdown 已复制');}
            catch(e){alert('复制失败，请手动复制');}
            document.body.removeChild(textarea);
        });
        return;
    }
    var textarea=document.createElement('textarea');
    textarea.value=text;
    textarea.style.position='fixed';
    textarea.style.opacity='0';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    try{document.execCommand('copy');alert('Markdown 已复制');}
    catch(e){alert('复制失败，请手动复制');}
    document.body.removeChild(textarea);
}
function setStatsExercise(mu, exerciseName){
    statsExerciseSelection[mu]=exerciseName;
    showStats();
    setTimeout(function(){
        window.scrollTo({top:document.documentElement.scrollHeight,behavior:'auto'});
    },50);
}
function showStats(){
    var container=document.getElementById('statsContainer');
    var y=curDate.getFullYear(),m=curDate.getMonth();
    var muscles=['chest','back','shoulder','leg','arm'];
    var isActive=function(btn){return statsSection===btn;};
    var htm='<div class="stats-buttons stats-buttons-nine">';
    for(var i=0;i<muscles.length;i++){
        var mu=muscles[i];
        var stats=calcMuscleStats(mu);
        if(stats.maxWeight>0||stats.maxDailyVol>0){
            htm+='<button class="stats-btn muscle-filter-btn '+mu+(isActive(mu)?' active':'')+'" onclick="setStats(\''+mu+'\')"><span class="stats-btn-icon">'+icons[mu]+'</span><span class="stats-btn-label">'+muscleNames[mu]+'</span></button>';
        }
    }
    htm+='<button class="stats-btn'+(isActive('month')?' active':'')+'" onclick="setStats(\'month\')"><span class="stats-btn-icon">📅</span><span class="stats-btn-label">月总</span></button>';
    htm+='<button class="stats-btn'+(isActive('year')?' active':'')+'" onclick="setStats(\'year\')"><span class="stats-btn-icon">📆</span><span class="stats-btn-label">年总</span></button>';
    htm+='<button class="stats-btn'+(isActive('days')?' active':'')+'" onclick="setStats(\'days\')"><span class="stats-btn-icon">🎯</span><span class="stats-btn-label">部位</span></button>';
    htm+='<button class="stats-btn'+(isActive('summary')?' active':'')+'" onclick="setStats(\'summary\')"><span class="stats-btn-icon">📝</span><span class="stats-btn-label">总结</span></button>';
    htm+='</div>';
    // 计算本月各部位训练天数
    var monthlyDays={};
    var monthlyMuscleDays={chest:0,back:0,shoulder:0,leg:0,arm:0};
    for(var dk in data){
        var parts=dk.split('-');
        var y2=parseInt(parts[0]),m2=parseInt(parts[1])-1;
        if(y2===y&&m2===m){
            monthlyDays[dk]=true;
            var exs=data[dk];
            var seen={};
            for(var i=0;i<exs.length;i++){
                var mu=exs[i].muscle;
                if(!seen[mu]&&monthlyMuscleDays.hasOwnProperty(mu)){seen[mu]=true;monthlyMuscleDays[mu]++;}
            }
        }
    }
    var yearlyWorkoutDays=0;
    for(var dk in data){
        var parts=dk.split('-');
        if(parseInt(parts[0])===y){
            yearlyWorkoutDays++;
        }
    }
    var monthWorkoutDays=Object.keys(monthlyDays).length;
    var totalMonthDays=getMonthDays(y,m);
    var monthRestDays=totalMonthDays-monthWorkoutDays;
    var totalYearDays=getYearDays(y);
    var yearlyRestDays=totalYearDays-yearlyWorkoutDays;
    if(statsSection==='month'){
        htm+='<div class="stats-card">';
        htm+='<div class="stats-card-title">📅 '+y+'年'+(m+1)+'月 总览</div>';
        htm+='<div class="stats-card-item"><div class="stats-label">🏋️ 锻炼天数</div><div class="stats-value"><span class="highlight">'+monthWorkoutDays+'</span> 天</div></div>';
        htm+='<div class="stats-card-item"><div class="stats-label">😴 休息天数</div><div class="stats-value"><span class="highlight">'+monthRestDays+'</span> 天</div></div>';
        htm+='<div class="stats-card-item"><div class="stats-label">📊 月出勤率</div><div class="stats-value">'+Math.round(monthWorkoutDays/totalMonthDays*100)+'%</div></div>';
        htm+='</div>';
    }
    if(statsSection==='year'){
        htm+='<div class="stats-card">';
        htm+='<div class="stats-card-title">📆 '+y+'年 总览</div>';
        htm+='<div class="stats-card-item"><div class="stats-label">🏋️ 锻炼天数</div><div class="stats-value"><span class="highlight">'+yearlyWorkoutDays+'</span> 天</div></div>';
        htm+='<div class="stats-card-item"><div class="stats-label">😴 休息天数</div><div class="stats-value"><span class="highlight">'+yearlyRestDays+'</span> 天</div></div>';
        htm+='<div class="stats-card-item"><div class="stats-label">📊 年出勤率</div><div class="stats-value">'+Math.round(yearlyWorkoutDays/totalYearDays*100)+'%</div></div>';
        htm+='</div>';
    }
    if(statsSection==='days'){
        htm+='<div class="stats-card">';
        htm+='<div class="stats-card-title">🎯 本月各部位训练天数</div>';
        var hasAnyMuscle=false;
        for(var i=0;i<muscles.length;i++){
            var mu=muscles[i];
            var days=monthlyMuscleDays[mu];
            var hasData=false;
            for(var dk in data){
                var parts=dk.split('-');
                if(parseInt(parts[0])===y&&parseInt(parts[1])-1===m){
                    var exs=data[dk];
                    for(var j=0;j<exs.length;j++){
                        if(exs[j].muscle===mu){hasData=true;break;}
                    }
                    if(hasData)break;
                }
            }
            if(hasData){
                hasAnyMuscle=true;
                htm+='<div class="stats-card-item"><div class="stats-label"><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:'+muscleColors[mu]+';margin-right:6px;vertical-align:middle;"></span>'+icons[mu]+' '+muscleNames[mu]+'</div><div class="stats-value"><span class="highlight">'+days+'</span> 天</div></div>';
            }
        }
        if(!hasAnyMuscle)htm+='<div class="stats-empty">本月暂无部位数据</div>';
        htm+='</div>';
    }
    if(statsSection==='summary'){
        htm+='<div class="stats-card">';
        htm+='<div class="stats-card-title">📝 全量训练总结</div>';
        htm+='<div class="stats-summary-actions"><button class="stats-copy-btn" onclick="copySummaryMarkdown()">复制 Markdown</button></div>';
        htm+='<pre class="stats-markdown">'+escapeHtml(generateSummaryMarkdown())+'</pre>';
        htm+='</div>';
    }else if(statsSection&&muscleNames[statsSection]){
        var mu=statsSection;
        var s=calcMuscleStats(mu);
        htm+='<div class="stats-card">';
        if(s.milestones&&s.milestones.length){
            htm+='<div class="milestone-section">';
            htm+='<div class="milestone-title">🏁 最大重量 Milestone</div>';
            var milestoneNames=Object.keys(s.exerciseMilestones||{}).filter(function(name){
                return s.exerciseMilestones[name]&&s.exerciseMilestones[name].length;
            });
            if(milestoneNames.length){
                var activeExercise=statsExerciseSelection[mu];
                if(!activeExercise||milestoneNames.indexOf(activeExercise)<0){
                    activeExercise=milestoneNames[0];
                    statsExerciseSelection[mu]=activeExercise;
                }
                htm+='<div class="milestone-actions">';
                for(var mni=0;mni<milestoneNames.length;mni++){
                    var exerciseName=milestoneNames[mni];
                    var escapedExerciseName=exerciseName.replace(/'/g,"\\'");
                    htm+='<button class="milestone-action-btn'+(exerciseName===activeExercise?' active':'')+'" onclick="setStatsExercise(\''+mu+'\',\''+escapedExerciseName+'\')">'+exerciseName+'</button>';
                }
                htm+='</div>';
                var milestoneList=s.exerciseMilestones[activeExercise].slice(-3).reverse();
                for(var mi=0;mi<milestoneList.length;mi++){
                    var milestone=milestoneList[mi];
                    htm+='<div class="milestone-item">'+
                        '<div class="milestone-value">'+milestone.weight+' kg</div>'+
                        '<div class="milestone-meta">'+milestone.sets+'组 × '+milestone.reps+'次</div>'+
                        '<div class="milestone-date">'+milestone.date+'</div>'+
                    '</div>';
                }
            }
            htm+='</div>';
        }else{
            htm+='<div class="stats-empty">暂无 milestone 数据</div>';
        }
        htm+='</div>';
    }
    container.innerHTML=htm;
}
function setStats(btn){
    statsSection=(statsSection===btn)?null:btn;
    showStats();
    // 点击后自动滚动到页面底部查看卡片内容
    setTimeout(function(){
        var el=document.getElementById('statsContainer');
        if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    },50);
}
function exportData(){
    var jsonStr=JSON.stringify(data,null,2);
    var blob=new Blob([jsonStr],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='fitness-data-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
    URL.revokeObjectURL(url);
}
function importData(input){
    var file=input.files[0];
    if(!file)return;
    var reader=new FileReader();
    reader.onload=function(e){
        try{
            var imported=JSON.parse(e.target.result);
            if(confirm('确定要导入数据吗？这将覆盖当前所有数据。')){
                data=imported;
                save();
                render();
                if(selDate)showDetail(selDate);
                alert('导入成功！');
            }
        }catch(err){
            alert('导入失败：文件格式不正确');
        }
    };
    reader.readAsText(file);
    input.value='';
}
function init(){
    render();
    var dk = getTodayKey();
    selDate = dk;
    render();
    showDetail(dk);
}
init();
